<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JETRO</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JETRO">
<meta name="theme-color" content="#0B1220">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');
  :root{
    --bg:#0B1220; --panel:#131C2E; --panel-2:#17233A; --border:#24304A;
    --text:#EDF1F7; --text-dim:#8A93A6; --text-faint:#5A6478;
    --green:#34D399; --green-dim:#1F5C48; --red:#FB7676; --red-dim:#5C2A2A;
    --amber:#FBBF24; --amber-dim:#5C4A1A; --accent:#6EE7C7; --accent2:#60A5FA;
    --radius:12px; --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; touch-action:pan-x pan-y; }
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); -webkit-font-smoothing:antialiased; min-height:100vh; }
  #app{ max-width:1000px; margin:0 auto; padding:20px 16px 60px; }
  a, button{ font-family:inherit; }
  button{ cursor:pointer; }
  .app-header{ margin-bottom:20px; }
  .app-title-row{ display:flex; align-items:center; gap:10px; margin:0 0 12px; flex-wrap:wrap; }
  .hamburger-btn{ background:var(--panel); border:1px solid var(--border); color:var(--text); border-radius:8px; width:38px; height:34px; font-size:16px; flex-shrink:0; }
  .app-title{ font-family:var(--font-display); font-weight:700; font-size:15px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-dim); flex:1; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  .save-status{ font-size:11px; color:var(--text-faint); text-transform:none; letter-spacing:0; font-family:var(--font-body); }
  .header-actions{ display:flex; align-items:center; gap:10px; }
  .hero{ background:linear-gradient(145deg,var(--panel),var(--panel-2)); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px; display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .hero-label{ font-size:13px; color:var(--text-dim); margin-bottom:4px; }
  .hero-value{ font-family:var(--font-mono); font-weight:600; font-size:clamp(24px,5vw,34px); letter-spacing:-0.02em; }
  .hero-value.neg{ color:var(--red); }
  .hero-value.pos{ color:var(--text); }
  .hero-sub{ font-size:12px; color:var(--text-faint); font-family:var(--font-mono); }

  .nav-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:40; opacity:0; pointer-events:none; transition:opacity .18s ease; }
  .nav-backdrop.open{ opacity:1; pointer-events:auto; }
  .nav-panel{ position:fixed; top:0; left:0; bottom:0; width:230px; background:var(--panel); border-right:1px solid var(--border); z-index:41; padding:16px 10px; overflow-y:auto; transform:translateX(-100%); transition:transform .18s ease; }
  .nav-panel.open{ transform:translateX(0); }
  .nav-panel-title{ font-family:var(--font-display); font-weight:700; font-size:16px; padding:8px 10px 16px; letter-spacing:.04em; }
  .nav-item{ display:block; width:100%; text-align:left; background:none; border:none; color:var(--text-dim); font-family:var(--font-display); font-weight:600; font-size:14px; padding:12px 10px; border-radius:8px; margin-bottom:2px; }
  .nav-item.active{ color:var(--accent); background:var(--panel-2); }
  .date-field{ grid-column:1/-1; }
  @media (min-width:900px){
    .hamburger-btn{ display:none; }
    .nav-panel{ transform:translateX(0) !important; }
    .nav-backdrop{ display:none; }
    #app{ margin-left:230px; }
  }

  .section-title{ font-family:var(--font-display); font-weight:600; font-size:16px; margin:24px 0 10px; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .section-title:first-child{ margin-top:0; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px; }
  .grid-2{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px; }
  .card{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:12px; }
  .mini-card{ background:var(--panel); border:1px solid var(--border); border-left:3px solid var(--border); border-radius:10px; padding:12px 14px; }
  .mini-card .name{ font-size:12px; color:var(--text-dim); margin-bottom:6px; display:flex; align-items:center; gap:6px; }
  .mini-card .val{ font-family:var(--font-mono); font-weight:600; font-size:17px; }
  .mini-card .val.neg{ color:var(--red); }
  .owner-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0; }
  .empty{ color:var(--text-faint); font-size:13px; padding:18px 4px; border:1px dashed var(--border); border-radius:var(--radius); text-align:center; }
  form.inline-form{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px; display:grid; gap:10px; margin-bottom:16px; }
  .form-row{ display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); }
  .form-row > div{ min-width:0; }
  label{ font-size:11px; color:var(--text-dim); display:block; margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em; }
  input, select{ width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:9px 10px; font-size:14px; font-family:var(--font-body); min-width:0; }
  input[type="number"]{ font-family:var(--font-mono); }
  input[type="date"]{ min-width:0; -webkit-appearance:none; appearance:none; }
  input[type="color"]{ padding:2px; height:36px; }
  .checkbox-row{ display:flex; align-items:center; gap:8px; }
  .checkbox-row input{ width:auto; }
  .checkbox-row label{ margin:0; text-transform:none; font-size:13px; color:var(--text); }
  .btn{ border-radius:8px; padding:9px 16px; font-size:13px; font-weight:600; border:1px solid var(--border); background:var(--panel-2); color:var(--text); }
  .btn-primary{ background:var(--green); border-color:var(--green); color:#04241A; }
  .btn-ghost{ background:none; border:1px solid var(--border); color:var(--text-dim); }
  .btn-small{ padding:6px 12px; font-size:12px; }
  .form-actions{ display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
  .list{ display:flex; flex-direction:column; gap:8px; }
  .list-item{ background:var(--panel); border:1px solid var(--border); border-left:3px solid var(--border); border-radius:10px; padding:10px 12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .li-main{ flex:1; min-width:160px; }
  .li-title{ font-size:14px; font-weight:500; }
  .li-sub{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .li-value{ font-family:var(--font-mono); font-weight:600; font-size:14px; white-space:nowrap; }
  .li-value.saida{ color:var(--red); }
  .li-value.entrada{ color:var(--green); }
  .li-value.presente, .li-value.investimento, .li-value.transfer{ color:var(--accent2); }
  .li-actions{ display:flex; gap:6px; flex-wrap:wrap; }
  .icon-btn{ background:none; border:1px solid var(--border); color:var(--text-faint); border-radius:7px; padding:5px 10px; font-size:12px; font-family:var(--font-body); }
  .icon-btn.danger{ color:var(--red); }
  .icon-btn.confirm{ color:#fff; background:var(--red); border-color:var(--red); font-weight:700; }
  .badge{ font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:3px 8px; border-radius:999px; white-space:nowrap; }
  .badge.late{ background:var(--red-dim); color:var(--red); }
  .badge.soon{ background:var(--amber-dim); color:var(--amber); }
  .badge.upcoming{ background:var(--panel-2); color:var(--text-dim); border:1px solid var(--border); }
  .badge.paid{ background:var(--green-dim); color:var(--green); }
  .tag{ font-size:10px; padding:2px 7px; border-radius:999px; background:var(--panel-2); color:var(--text-dim); border:1px solid var(--border); margin-left:6px; }
  .report-row{ display:grid; gap:6px; margin-bottom:12px; }
  .report-head{ display:flex; justify-content:space-between; font-size:13px; }
  .report-cat{ font-weight:500; }
  .report-val{ font-family:var(--font-mono); color:var(--text-dim); }
  .bar-track{ height:8px; background:var(--panel-2); border-radius:999px; overflow:hidden; border:1px solid var(--border); }
  .bar-fill{ height:100%; background:linear-gradient(90deg,var(--accent),var(--green)); }
  .bar-fill.over{ background:linear-gradient(90deg,var(--amber),var(--red)); }
  .month-picker{ display:flex; align-items:center; gap:8px; margin-bottom:0; }
  .month-picker button{ background:var(--panel); border:1px solid var(--border); color:var(--text); border-radius:8px; width:34px; height:30px; font-size:13px; }
  .month-picker .label{ font-family:var(--font-mono); font-weight:600; font-size:14px; min-width:120px; text-align:center; text-transform:capitalize; }
  .settings-block{ margin-top:30px; padding-top:16px; border-top:1px solid var(--border); }
  .settings-note{ font-size:12px; color:var(--text-faint); margin-bottom:10px; }
  .loading, .setup-notice{ text-align:center; color:var(--text-dim); padding:60px 20px; font-size:13px; }
  .setup-notice code{ background:var(--panel); border:1px solid var(--border); padding:2px 6px; border-radius:5px; font-family:var(--font-mono); }
  .export-status{ font-size:12px; color:var(--text-dim); margin-top:8px; }
  .export-surface{ background:var(--bg); padding:6px; border-radius:8px; }
  .chart-wrap{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px; }
  .chart-wrap canvas{ max-height:260px; }
  .summary-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-bottom:16px; }
  .autocomplete-hint{ font-size:11px; color:var(--accent); margin-top:4px; }
  .card-head{ display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:8px; cursor:pointer; }
  .expand-btn{ background:var(--panel-2); border:1px solid var(--border); color:var(--text-dim); border-radius:7px; width:30px; height:30px; font-size:13px; flex-shrink:0; }
  @media (max-width:480px){ .hero{ padding:16px; } }
</style>
</head>
<body>
<div id="app"><div class="loading">Carregando seus dados...</div></div>
<script>
(function(){
  'use strict';

  // ======================================================================
  // CONFIGURACAO -- cole aqui a URL do seu Google Apps Script (termina em /exec)
  // ======================================================================
  var CONFIG = { API_URL: 'https://script.google.com/macros/s/AKfycbyvINh2L6mPb0AR5snpsuxnjHrw15e9JyGFni8LUe76rPBGkMP2W_H3eKHbmchPsVP8/exec' };
  // ======================================================================

  var DEFAULT_CATEGORIES = ['Alimentação','Mercado','Transporte','Moradia','Lazer','Saúde','Educação','Assinaturas','Vestuário','Pets','Presentes','Outros'];
  var DEFAULT_INCOME_CATEGORIES = ['Salário','Prestação de serviço','Presentes','Renda extra','Outros'];
  var PRESENTE_CATEGORIES = ['Dízimos','Ofertas'];
  var DEFAULT_PRESENTE_CATEGORIES = PRESENTE_CATEGORIES;
  var FORMAS = ['Cartão de Crédito','Pix','Débito','Dinheiro'];
  var FORMAS_RECEITA = ['Pix','Dinheiro'];
  var PAGAMENTO_FATURA_FORMA = 'Pagamento de Fatura';
  var TIPOS = [
    { v:'saida', l:'Saída (gasto)' },
    { v:'entrada', l:'Entrada (receita)' },
    { v:'presente', l:'Dízimos / Ofertas' },
    { v:'investimento', l:'Investimento' },
    { v:'transferencia', l:'Transferência entre contas' }
  ];
  var MONTHS_PT = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  var MONTHS_SHORT_PT = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  var TITULARES_PADRAO = ['Guilherme','Ana Julia'];
  var DEFAULT_COLORS = { 'Guilherme': '#60A5FA', 'Ana Julia': '#F472B6' };
  var FORMA_FIXA = [
    { v:'debito_automatico', l:'Débito automático' },
    { v:'cartao', l:'Desconta no cartão' },
    { v:'boleto', l:'Boleto avulso' }
  ];
  var NAV_TABS = [['overview','Visão geral'],['vencimentos','Vencimentos'],['transactions','Lançamentos'],['accounts','Contas'],['cards','Cartões'],['bills','Contas fixas'],['report','Relatório'],['settings','Ajustes']];

  function freshTxDraft(){ return { value:'', date: todayISO(), desc:'', category: '', forma: FORMAS[0], tipo:'saida', accountId:'', cardId:'', origemId:'', destinoId:'', installments:'1', invoiceCycleOverride:'', applyToFollowing:false }; }
  function freshBillDraft(){ return { name:'', natureza:'despesa', value:'', dueDay:'', tipoRecorrencia:'eterna', totalParcelas:'12', forma:'debito_automatico', cardId:'', accountId:'', startMonth:'' }; }
  function defaultReportFilter(){ return { mode:'month', month: currentMonthKey(), from:'', to:'', tipo:'saida', categoria:'', conta:'', cartao:'' }; }
  function defaultTxFilter(){ return { tipo:'', categoria:'', conta:'', cartao:'' }; }

  var state = {
    tab: 'overview',
    navOpen: false,
    filterTitular: '',
    accounts: [],
    cards: [],
    transactions: [],
    fixedBills: [],
    categories: DEFAULT_CATEGORIES.slice(),
    incomeCategories: DEFAULT_INCOME_CATEGORIES.slice(),
    presenteCategories: DEFAULT_PRESENTE_CATEGORIES.slice(),
    titularColors: Object.assign({}, DEFAULT_COLORS),
    budgets: {},
    reportFilter: defaultReportFilter(),
    txFilter: defaultTxFilter(),
    billsMonth: currentMonthKey(),
    vencimentosSort: 'status',
    vencimentosMonth: 'todos',
    txMonth: currentMonthKey(),
    expandedCards: {},
    editing: { type:null, id:null, transferId:null },
    txDraft: null,
    billDraft: null,
    payingCycle: null,
    launchingBillId: null,
    openBillMenu: null,
    categoriesOpen: false,
    incomeCategoriesOpen: false,
    presenteCategoriesOpen: false,
    confirmingDeleteKey: null,
    saveStatus: ''
  };
  state.txDraft = freshTxDraft();
  state.billDraft = freshBillDraft();

  var saveTimer = null;
  var charts = { pie:null, trend:null };

  function isConfigured(){ return CONFIG.API_URL && CONFIG.API_URL.indexOf('http') === 0; }

  // ---------- helpers ----------
  function uid(){ return 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function todayISO(){ var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
  function pad2(n){ return String(n).padStart(2,'0'); }
  function currentMonthKey(){ return todayISO().slice(0,7); }
  function fmtBRL(n){ return (Number(n)||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' }); }
  function fmtDate(d){ if(!d) return ''; var p = d.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
  function fmtDateObj(d){ return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear(); }
  function fmtDateShort(d){ return pad2(d.getDate())+'/'+pad2(d.getMonth()+1); }
  function esc(s){ return String(s===undefined||s===null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function monthLabel(mk){ var p = mk.split('-'); return MONTHS_PT[parseInt(p[1],10)-1] + ' de ' + p[0]; }
  function shiftMonth(mk, delta){ var p = mk.split('-').map(Number); var y=p[0], m=p[1]; m+=delta; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} return y+'-'+pad2(m); }
  function toLocalDate(s){ var p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
  function daysInMonth(y,m){ return new Date(y, m, 0).getDate(); }
  function clampInt(v,min,max){ v = parseInt(v,10); if(isNaN(v)) v = min; if(v<min) v=min; if(v>max) v=max; return v; }
  function ownerColor(titular){ return state.titularColors[titular] || 'var(--border)'; }

  // ---------- feriados nacionais (calendario bancario Brasil) ----------
  function easterDate(year){
    var a=year%19, b=Math.floor(year/100), c=year%100, d=Math.floor(b/4), e=b%4;
    var f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3), h=(19*a+b-d-g+15)%30;
    var i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451);
    var month=Math.floor((h+l-7*m+114)/31), day=((h+l-7*m+114)%31)+1;
    return new Date(year, month-1, day);
  }
  function addDays(d,n){ var r=new Date(d); r.setDate(r.getDate()+n); return r; }
  var HOLIDAY_CACHE = {};
  function nationalHolidayKeys(year){
    if(HOLIDAY_CACHE[year]) return HOLIDAY_CACHE[year];
    var easter = easterDate(year);
    var list = [
      new Date(year,0,1), addDays(easter,-48), addDays(easter,-47), addDays(easter,-2),
      new Date(year,3,21), new Date(year,4,1), addDays(easter,60), new Date(year,8,7),
      new Date(year,9,12), new Date(year,10,2), new Date(year,10,15), new Date(year,10,20),
      new Date(year,11,25)
    ];
    var keys = {};
    list.forEach(function(d){ keys[d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())] = true; });
    HOLIDAY_CACHE[year] = keys;
    return keys;
  }
  function isHoliday(d){ return !!nationalHolidayKeys(d.getFullYear())[d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())]; }
  function isBusinessDay(d){ return d.getDay()!==0 && d.getDay()!==6 && !isHoliday(d); }

  // ---------- card billing cycle ----------
  function cardClosingDate(card, y, m){
    var day = Math.min(card.closingDay || 1, daysInMonth(y,m));
    var d = new Date(y, m-1, day);
    while(!isBusinessDay(d)){ d.setDate(d.getDate()+1); }
    return d;
  }
  function invoiceCycleForDate(card, dateObj){
    var y = dateObj.getFullYear(), m = dateObj.getMonth()+1;
    var closing = cardClosingDate(card, y, m);
    if(dateObj.getTime() <= closing.getTime()) return { year:y, month:m };
    var nm=m+1, ny=y; if(nm>12){nm=1;ny++;}
    return { year:ny, month:nm };
  }
  function cycleKey(c){ return c.year + '-' + pad2(c.month); }
  function addMonthsToCycle(c,n){ var m=c.month+n,y=c.year; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return {year:y,month:m}; }
  function parseCycleKey(k){ var p=k.split('-').map(Number); return {year:p[0],month:p[1]}; }
  function invoiceDueDate(card, cycle){
    var dm=cycle.month, dy=cycle.year;
    if((card.dueDay||1) < (card.closingDay||1)){ dm++; if(dm>12){dm=1;dy++;} }
    var day = Math.min(card.dueDay||1, daysInMonth(dy,dm));
    var d = new Date(dy, dm-1, day);
    while(!isBusinessDay(d)){ d.setDate(d.getDate()+1); }
    return d;
  }
  function cycleOpenDate(card, cycle){
    var prev = addMonthsToCycle(cycle,-1);
    var closing = cardClosingDate(card, prev.year, prev.month);
    var d = new Date(closing); d.setDate(d.getDate()+1);
    return d;
  }
  function cardInvoiceTotal(card, ck){
    var total=0;
    for(var i=0;i<state.transactions.length;i++){ var t=state.transactions[i]; if(t.cardId===card.id && t.invoiceCycleKey===ck) total+=Number(t.value); }
    return total;
  }
  function cyclePaid(card, ck){ return (card.paymentsByCycle && card.paymentsByCycle[ck]) || 0; }
  function isInvoicePayment(t){ return !!t && t.forma === PAGAMENTO_FATURA_FORMA; }
  function invoicePaymentInfo(t){
    if(!isInvoicePayment(t)) return null;
    if(t.paidCardId && t.paidCycleKey) return { cardId:t.paidCardId, ck:t.paidCycleKey };
    // lancamentos antigos: deduz pelo texto "<cartao> - Pagamento de fatura (<mes> de <ano>)"
    var m = /^(.*) - Pagamento de fatura \((\S+) de (\d{4})\)$/.exec(t.desc||'');
    if(!m) return null;
    var mi = MONTHS_PT.indexOf(m[2]);
    var card = state.cards.filter(function(c){ return c.name===m[1]; })[0];
    if(mi<0 || !card) return null;
    return { cardId:card.id, ck: m[3]+'-'+pad2(mi+1) };
  }
  function revertInvoicePayment(t){
    var info = invoicePaymentInfo(t); if(!info) return;
    var card = state.cards.filter(function(c){ return c.id===info.cardId; })[0];
    if(!card || !card.paymentsByCycle) return;
    var left = Math.round(((card.paymentsByCycle[info.ck]||0) - Number(t.value))*100)/100;
    if(left > 0.009) card.paymentsByCycle[info.ck] = left; else delete card.paymentsByCycle[info.ck];
  }
  function closedCycleKey(card){
    var now=new Date(); var y=now.getFullYear(), m=now.getMonth()+1;
    var closing = cardClosingDate(card,y,m);
    var todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if(todayMid.getTime() > closing.getTime()) return cycleKey({year:y,month:m});
    var pm=m-1,py=y; if(pm<1){pm=12;py--;}
    return cycleKey({year:py,month:pm});
  }
  function openCycleKey(card){ return cycleKey(invoiceCycleForDate(card, new Date())); }
  function pendingTotal(card){
    var total=0;
    for(var i=0;i<state.transactions.length;i++){
      var t=state.transactions[i];
      if(t.cardId===card.id){ total += Number(t.value); }
    }
    var paidTotal = 0;
    var pm = card.paymentsByCycle || {};
    Object.keys(pm).forEach(function(k){ paidTotal += pm[k]; });
    return total - paidTotal;
  }
  function nearbyCycles(card, centerDate, back, fwd){
    var base = invoiceCycleForDate(card, centerDate);
    var out = [];
    for(var i=-back;i<=fwd;i++) out.push(addMonthsToCycle(base,i));
    return out;
  }

  // ---------- balances ----------
  function accountBalance(acc){
    var bal = Number(acc.saldoInicial) || 0;
    for(var i=0;i<state.transactions.length;i++){
      var t = state.transactions[i];
      if(t.accountId === acc.id){ bal += (t.tipo === 'entrada' ? Number(t.value) : -Number(t.value)); }
    }
    return bal;
  }

  function computeStatus(dueDateObj, paidFraction){
    if(paidFraction >= 1) return { label:'Pago', cls:'paid', order:3 };
    var today = new Date(); today.setHours(0,0,0,0);
    var diffDays = Math.round((dueDateObj.getTime()-today.getTime())/86400000);
    if(diffDays < 0) return { label: paidFraction>0 ? 'Parcial - atrasada' : 'Atrasada', cls:'late', order:0 };
    if(diffDays <= 3) return { label: paidFraction>0 ? 'Parcial - vence em breve' : 'Vence em breve', cls:'soon', order:1 };
    return { label: paidFraction>0 ? 'Parcial - a vencer' : 'A vencer', cls:'upcoming', order:2 };
  }

  function billTxMonth(t){ return t.billMonth || t.date.slice(0,7); }
  function billTransactionMonths(bill){
    var set = {};
    state.transactions.forEach(function(t){ if(t.billId===bill.id) set[billTxMonth(t)] = true; });
    return Object.keys(set);
  }
  function billTransactionsInMonth(bill, mk){ return state.transactions.filter(function(t){ return t.billId===bill.id && billTxMonth(t)===mk; }); }
  function billPaidMonthsCombined(bill){
    var set = {};
    billTransactionMonths(bill).forEach(function(mk){ set[mk]=true; });
    (bill.manuallyPaidMonths||[]).forEach(function(mk){ set[mk]=true; });
    return Object.keys(set);
  }
  function billIsPaidInMonth(bill, mk){ return billPaidMonthsCombined(bill).indexOf(mk) !== -1; }

  function monthDiff(a, b){ var pa=a.split('-').map(Number), pb=b.split('-').map(Number); return (pb[0]-pa[0])*12 + (pb[1]-pa[1]); }
  function billActiveInMonth(b, mk){
    if(b.startMonth && mk < b.startMonth) return false;
    if(b.endMonth && mk > b.endMonth) return false;
    if(b.tipoRecorrencia === 'parcelada'){
      var total = b.totalParcelas || 1;
      if(b.startMonth) return monthDiff(b.startMonth, mk) < total;
      if(billIsPaidInMonth(b, mk)) return true;
      return billPaidMonthsCombined(b).length < total;
    }
    return true;
  }
  function billParcelaLabel(b, mk){
    if(b.tipoRecorrencia !== 'parcelada') return '';
    if(b.startMonth) return (monthDiff(b.startMonth, mk)+1) + '/' + b.totalParcelas;
    return billPaidMonthsCombined(b).length + '/' + b.totalParcelas;
  }
  function billsForMonth(mk){ return state.fixedBills.filter(function(b){ return billActiveInMonth(b, mk); }); }
  function activeFixedBills(){ return billsForMonth(currentMonthKey()); }
  function billValueInMonth(b, mk){
    var txs = billTransactionsInMonth(b, mk);
    if(txs.length) return txs.reduce(function(s,t){ return s + Number(t.value); }, 0);
    return Number(b.value) || 0;
  }
  function fixedBillDueDate(bill, mk){
    var p = (mk || currentMonthKey()).split('-').map(Number);
    var day = Math.min(bill.dueDay||1, daysInMonth(p[0],p[1]));
    return new Date(p[0], p[1]-1, day);
  }
  function earliestBillMonth(b){ var m = billPaidMonthsCombined(b).sort(); return m[0] || ''; }

  function getReminders(monthMode){
    var cur = currentMonthKey();
    var items = [];
    [shiftMonth(cur,-1), cur, shiftMonth(cur,1)].forEach(function(mk){
      billsForMonth(mk).forEach(function(b){
        var due = fixedBillDueDate(b, mk);
        var paid = billIsPaidInMonth(b, mk);
        var parc = billParcelaLabel(b, mk);
        items.push({ title:b.name+(parc?' ('+parc+')':''), sub:(b.natureza==='receita'?'Receita fixa':'Despesa fixa')+' - vence em '+fmtDateObj(due), value:billValueInMonth(b, mk), status:computeStatus(due, paid?1:0), dueDate:due, kind:'bill', id:b.id, paid:paid });
      });
    });
    state.cards.forEach(function(c){
      var openCk = openCycleKey(c), closedCk = closedCycleKey(c);
      var set = {}; set[openCk] = true; set[closedCk] = true;
      // faturas antigas que ainda tem saldo em aberto
      state.transactions.forEach(function(t){ if(t.cardId===c.id && t.invoiceCycleKey && t.invoiceCycleKey < closedCk) set[t.invoiceCycleKey] = true; });
      Object.keys(set).forEach(function(ck){
        var total = cardInvoiceTotal(c, ck);
        if(total <= 0) return;
        var paid = cyclePaid(c, ck);
        var restante = total - paid;
        if(ck < closedCk && restante <= 0.009) return;
        var cyc = parseCycleKey(ck);
        var due = invoiceDueDate(c, cyc);
        var isOpen = ck === openCk;
        items.push({ title:c.name+' - Fatura'+(isOpen?' (em aberto)':''), sub:(isOpen?'Fecha em '+fmtDateObj(cardClosingDate(c, cyc.year, cyc.month))+' - ':'')+'Vence em '+fmtDateObj(due), value:Math.max(0,restante), status:computeStatus(due, paid/total), dueDate:due, kind:'invoice', id:c.id, paid: restante <= 0.009 });
      });
    });
    return filterRemindersByMonth(items, monthMode || 'todos');
  }

  function sortReminders(items, sortMode){
    var arr = items.slice();
    if(sortMode === 'valor'){ arr.sort(function(a,b){ return b.value - a.value; }); }
    else if(sortMode === 'data'){ arr.sort(function(a,b){ return a.dueDate.getTime()-b.dueDate.getTime(); }); }
    else{ arr.sort(function(a,b){ if(a.status.order!==b.status.order) return a.status.order-b.status.order; return a.dueDate.getTime()-b.dueDate.getTime(); }); }
    return arr;
  }
  function filterRemindersByMonth(items, monthMode){
    var cur = currentMonthKey();
    var target = monthMode==='anterior' ? shiftMonth(cur,-1) : (monthMode==='proximo' ? shiftMonth(cur,1) : (monthMode==='atual' ? cur : null));
    return items.filter(function(r){
      var mk = r.dueDate.getFullYear()+'-'+pad2(r.dueDate.getMonth()+1);
      if(target) return mk === target;
      return !(r.paid && mk < cur); // "Todos": esconde o que ja foi pago em meses passados
    });
  }

  // ---------- filters (report/transactions) ----------
  function matchesFilter(t, f){
    if(!f) return true;
    if(f.categoria && t.category !== f.categoria) return false;
    if(f.conta && t.accountId !== f.conta) return false;
    if(f.cartao && t.cardId !== f.cartao) return false;
    return true;
  }
  function matchesTipoFilter(t, tipo){
    if(!tipo) return true;
    if(tipo === 'transferencia') return !!t.isTransfer;
    return !t.isTransfer && t.tipo === tipo;
  }
  // pagamento de fatura nao conta como gasto (as compras do cartao ja contam)
  function countsAsReportTx(t, tipo){ return t.tipo === tipo && !t.isTransfer && !isInvoicePayment(t); }
  function categoryListForTipo(tipo){
    var base = tipo==='entrada' ? state.incomeCategories : (tipo==='presente' ? PRESENTE_CATEGORIES : (tipo==='saida' || tipo==='investimento' ? state.categories : state.categories.concat(state.incomeCategories, PRESENTE_CATEGORIES)));
    var set = {}, out = [];
    base.forEach(function(c){ if(!set[c]){ set[c]=true; out.push(c); } });
    state.transactions.forEach(function(t){ if(t.category && !set[t.category] && matchesTipoFilter(t, tipo)){ set[t.category]=true; out.push(t.category); } });
    return out;
  }
  function categoryTotalsInRange(fromDate, toDate, tipo, f){
    tipo = tipo || 'saida';
    var map = {};
    for(var i=0;i<state.transactions.length;i++){
      var t = state.transactions[i];
      if(!countsAsReportTx(t, tipo)) continue;
      if(!matchesFilter(t, f)) continue;
      var d = toLocalDate(t.date);
      if(d.getTime()>=fromDate.getTime() && d.getTime()<=toDate.getTime()) map[t.category] = (map[t.category]||0)+Number(t.value);
    }
    var arr = Object.keys(map).map(function(k){ return [k, map[k]]; });
    arr.sort(function(a,b){ return b[1]-a[1]; });
    return arr;
  }
  function totalByTipoInRange(tipo, fromDate, toDate, f){
    var total = 0;
    for(var i=0;i<state.transactions.length;i++){
      var t = state.transactions[i];
      if(!countsAsReportTx(t, tipo)) continue;
      if(!matchesFilter(t, f)) continue;
      var d = toLocalDate(t.date);
      if(d.getTime()>=fromDate.getTime() && d.getTime()<=toDate.getTime()) total += Number(t.value);
    }
    return total;
  }
  function resolveReportRange(){
    var f = state.reportFilter; var today = new Date(); today.setHours(0,0,0,0);
    if(f.mode==='month'){ var p=f.month.split('-').map(Number); return { from:new Date(p[0],p[1]-1,1), to:new Date(p[0],p[1],0) }; }
    if(f.mode==='last3'){ var fm=shiftMonth(currentMonthKey(),-2).split('-').map(Number); return { from:new Date(fm[0],fm[1]-1,1), to:today }; }
    if(f.mode==='last6'){ var fm6=shiftMonth(currentMonthKey(),-5).split('-').map(Number); return { from:new Date(fm6[0],fm6[1]-1,1), to:today }; }
    if(f.mode==='year'){ return { from:new Date(today.getFullYear(),0,1), to:today }; }
    if(f.mode==='custom'){ return { from: f.from?toLocalDate(f.from):new Date(2000,0,1), to: f.to?toLocalDate(f.to):today }; }
    return { from:today, to:today };
  }
  function reportRangeLabel(){
    var f = state.reportFilter;
    if(f.mode==='month') return monthLabel(f.month);
    if(f.mode==='last3') return 'últimos 3 meses';
    if(f.mode==='last6') return 'últimos 6 meses';
    if(f.mode==='year') return 'ano de '+new Date().getFullYear();
    if(f.mode==='custom') return (f.from?fmtDate(f.from):'...')+' até '+(f.to?fmtDate(f.to):'...');
    return '';
  }
  function last6MonthsTrend(tipo, f){
    var out = [];
    for(var i=5;i>=0;i--){
      var mk = shiftMonth(currentMonthKey(),-i);
      var p = mk.split('-').map(Number);
      var from = new Date(p[0],p[1]-1,1), to = new Date(p[0],p[1],0);
      out.push({ label: MONTHS_SHORT_PT[p[1]-1]+'/'+String(p[0]).slice(2), total: totalByTipoInRange(tipo || 'saida', from, to, f) });
    }
    return out;
  }

  function allTitulares(){
    var set = {};
    TITULARES_PADRAO.forEach(function(t){ set[t]=true; });
    state.accounts.forEach(function(a){ if(a.titular) set[a.titular]=true; });
    state.cards.forEach(function(c){ if(c.titular) set[c.titular]=true; });
    return Object.keys(set);
  }
  function passesOwnerFilter(titular){ return !state.filterTitular || titular === state.filterTitular; }

  // ---------- autocomplete ----------
  function findAutocompleteMatch(descValue){
    if(!descValue) return null;
    var needle = descValue.trim().toLowerCase();
    if(!needle) return null;
    var best = null;
    for(var i=state.transactions.length-1;i>=0;i--){
      var t = state.transactions[i];
      if(t.desc && t.desc.trim().toLowerCase() === needle){ best = t; break; }
    }
    return best;
  }

  // ---------- draft seeding ----------
  function seedTxDraft(t){
    if(!t) return freshTxDraft();
    var d = { value:t.value, date:t.date, desc:t.desc, category:t.category, forma:t.forma, tipo:t.tipo, accountId:t.accountId||'', cardId:t.cardId||'', origemId:'', destinoId:'', installments:'1', invoiceCycleOverride:t.invoiceCycleKey||'', applyToFollowing:false };
    if(t.isTransfer){
      d.tipo = 'transferencia';
      var pair = state.transactions.filter(function(x){ return x.transferId===t.transferId; });
      var saidaLeg = pair.filter(function(x){return x.tipo==='saida';})[0] || t;
      var entradaLeg = pair.filter(function(x){return x.tipo==='entrada';})[0];
      d.origemId = saidaLeg.accountId||'';
      d.destinoId = entradaLeg ? (entradaLeg.accountId||'') : '';
      d.value = saidaLeg.value; d.date = saidaLeg.date; d.desc = saidaLeg.desc; d.category = saidaLeg.category;
    }
    return d;
  }
  function seedBillDraft(b){
    if(!b) return freshBillDraft();
    return { name:b.name, natureza:b.natureza, value:b.value, dueDay:b.dueDay, tipoRecorrencia:b.tipoRecorrencia, totalParcelas:b.totalParcelas||'12', forma:b.forma, cardId:b.cardId||'', accountId:b.accountId||'', startMonth:b.startMonth||earliestBillMonth(b)||'' };
  }

  // ---------- persistence ----------
  function setSaveStatus(msg){ state.saveStatus = msg; var el = document.getElementById('save-status'); if(el) el.textContent = msg; }
  var EPHEMERAL_KEYS = ['editing','confirmingDeleteKey','payingCycle','launchingBillId','txDraft','billDraft','navOpen','expandedCards','billsMonth','saveStatus'];

  function loadState(){
    if(!isConfigured()){
      document.getElementById('app').innerHTML = '<div class="setup-notice">Este painel ainda não está conectado a uma planilha.<br><br>'
        + 'Procure por <code>CONFIG.API_URL</code> perto do topo do script e cole ali a URL do seu Google Apps Script (termina em <code>/exec</code>).</div>';
      return;
    }
    fetch(CONFIG.API_URL).then(function(r){ return r.json(); }).then(function(saved){
      if(saved && typeof saved === 'object'){
        Object.keys(saved).forEach(function(k){
          if(EPHEMERAL_KEYS.indexOf(k) === -1) state[k] = saved[k];
        });
        if(!state.categories || !state.categories.length) state.categories = DEFAULT_CATEGORIES.slice();
        if(!state.incomeCategories || !state.incomeCategories.length) state.incomeCategories = DEFAULT_INCOME_CATEGORIES.slice();
        if(!state.presenteCategories || !state.presenteCategories.length) state.presenteCategories = DEFAULT_PRESENTE_CATEGORIES.slice();
        if(!state.titularColors) state.titularColors = Object.assign({}, DEFAULT_COLORS);
        if(!state.budgets) state.budgets = {};
        state.presenteCategories = PRESENTE_CATEGORIES.slice();
        state.reportFilter = Object.assign(defaultReportFilter(), state.reportFilter || {});
        state.txFilter = Object.assign(defaultTxFilter(), state.txFilter || {});
        // migra categorias antigas de dizimo/oferta
        (state.transactions||[]).forEach(function(t){
          if(t.tipo !== 'presente') return;
          if(t.category === 'Dízimo') t.category = 'Dízimos';
          if(t.category === 'Oferta') t.category = 'Ofertas';
        });
        // contas fixas antigas ganham um mes de inicio (1o mes lancado, ou o mes atual)
        (state.fixedBills||[]).forEach(function(b){ if(!b.startMonth) b.startMonth = earliestBillMonth(b) || currentMonthKey(); });
      }
      render();
    }).catch(function(err){
      document.getElementById('app').innerHTML = '<div class="setup-notice">Não foi possível carregar os dados agora.<br>'
        + 'Verifique a URL em <code>CONFIG.API_URL</code> e se a implantação está com acesso "Qualquer pessoa".<br><br>'
        + '<span style="font-size:11px;color:var(--text-faint)">'+esc(String(err))+'</span></div>';
    });
  }

  function persist(){
    clearTimeout(saveTimer);
    setSaveStatus('Salvando...');
    saveTimer = setTimeout(function(){
      if(!isConfigured()) return;
      var toSave = {
        tab: state.tab, filterTitular: state.filterTitular, accounts: state.accounts, cards: state.cards,
        transactions: state.transactions, fixedBills: state.fixedBills, categories: state.categories, incomeCategories: state.incomeCategories, presenteCategories: state.presenteCategories,
        titularColors: state.titularColors, budgets: state.budgets, reportFilter: state.reportFilter,
        vencimentosSort: state.vencimentosSort, vencimentosMonth: state.vencimentosMonth, txFilter: state.txFilter
      };
      fetch(CONFIG.API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(toSave) })
        .then(function(){ setSaveStatus('Salvo'); })
        .catch(function(err){ setSaveStatus('Erro ao salvar'); console.error(err); });
    }, 400);
  }
  function update(mutator){ mutator(); persist(); render(); }

  // ---------- shared render bits ----------
  function optionsHTML(list, selected){ return list.map(function(v){ return '<option value="'+esc(v)+'" '+(v===selected?'selected':'')+'>'+esc(v)+'</option>'; }).join(''); }

  function sidebarHTML(){
    var openCls = state.navOpen ? ' open' : '';
    return '<div class="nav-backdrop'+openCls+'" data-action="close-nav"></div>'
      + '<div class="nav-panel'+openCls+'">'
      + '<div class="nav-panel-title">JETRO</div>'
      + NAV_TABS.map(function(t){ return '<button type="button" class="nav-item '+(state.tab===t[0]?'active':'')+'" data-action="go-tab" data-tab="'+t[0]+'">'+t[1]+'</button>'; }).join('')
      + '</div>';
  }

  function ownerFilterHTML(){
    var opts = ['<option value="">Todos</option>'].concat(allTitulares().map(function(t){ return '<option value="'+esc(t)+'" '+(state.filterTitular===t?'selected':'')+'>'+esc(t)+'</option>'; }));
    return '<select data-action="owner-filter-change" style="width:auto;min-width:130px;">'+opts.join('')+'</select>';
  }

  function headerHTML(){
    return '<div class="app-header">'
      + '<div class="app-title-row"><button type="button" class="hamburger-btn" data-action="toggle-nav">&#9776;</button>'
      + '<p class="app-title">JETRO <span class="header-actions">'+ownerFilterHTML()+'<span class="save-status" id="save-status">'+esc(state.saveStatus)+'</span>'
      + '<button type="button" class="icon-btn" data-action="refresh-now">Atualizar agora</button></span></p></div>'
      + '</div>';
  }

  function heroSaldoHTML(){
    var totalSaldo=0, totalInvest=0;
    state.accounts.forEach(function(a){
      if(!passesOwnerFilter(a.titular)) return;
      var bal = accountBalance(a);
      if(a.isInvestment) totalInvest += bal; else totalSaldo += bal;
    });
    var extra = totalInvest !== 0 ? ' <span style="font-size:12px;color:var(--text-dim);font-weight:400;">(+ '+fmtBRL(totalInvest)+' em investimentos)</span>' : '';

      + '<div class="hero-sub">'+state.accounts.length+' conta(s) - '+state.cards.length+' cartão(ões)</div>'
      + '</div>';
  }

  // ---------- overview ----------
  function renderOverview(){
    var html = heroSaldoHTML();
    html += '<div class="section-title">Contas</div>';
    var accs = state.accounts.filter(function(a){ return passesOwnerFilter(a.titular); });
    if(accs.length === 0){
      html += '<div class="empty">Nenhuma conta '+(state.filterTitular?'de '+esc(state.filterTitular)+' ':'')+'cadastrada.</div>';
    }else{
      html += '<div class="grid">' + accs.map(function(a){
        var bal = accountBalance(a);
        var tag = a.isInvestment ? '<span class="tag">Investimento</span>' : '';
        return '<div class="mini-card" style="border-left-color:'+ownerColor(a.titular)+'"><div class="name"><span class="owner-dot" style="background:'+ownerColor(a.titular)+'"></span>'+esc(a.name)+(a.titular?' ('+esc(a.titular)+')':'')+tag+'</div><div class="val '+(bal<0?'neg':'')+'">'+fmtBRL(bal)+'</div></div>';
      }).join('') + '</div>';
    }

    html += '<div class="section-title">Faturas em aberto (mês atual)</div>';
    var crds = state.cards.filter(function(c){ return passesOwnerFilter(c.titular); });
    if(crds.length === 0){
      html += '<div class="empty">Nenhum cartão '+(state.filterTitular?'de '+esc(state.filterTitular)+' ':'')+'cadastrado.</div>';
    }else{
      html += '<div class="grid">' + crds.map(function(c){
        var open = cardInvoiceTotal(c, openCycleKey(c));
        return '<div class="mini-card" style="border-left-color:'+ownerColor(c.titular)+'"><div class="name"><span class="owner-dot" style="background:'+ownerColor(c.titular)+'"></span>'+esc(c.name)+(c.titular?' ('+esc(c.titular)+')':'')+'</div><div class="val">'+fmtBRL(open)+'</div></div>';
      }).join('') + '</div>';
    }

    html += '<div class="section-title">Próximos vencimentos</div>';
    var reminders = sortReminders(getReminders('todos').filter(function(r){ return !r.paid; }), 'status').slice(0,6);
    if(reminders.length === 0){
      html += '<div class="empty">Nenhuma conta fixa ou fatura pendente no momento.</div>';
    }else{
      html += '<div class="list">' + reminders.map(function(r){
        return '<div class="list-item"><div class="li-main"><div class="li-title">'+esc(r.title)+'</div><div class="li-sub">'+esc(r.sub)+'</div></div>'
          + '<span class="badge '+r.status.cls+'">'+r.status.label+'</span><div class="li-value">'+fmtBRL(r.value)+'</div></div>';
      }).join('') + '</div>';
    }

    var mk = currentMonthKey();
    var range = { from: toLocalDate(mk+'-01'), to: new Date(new Date().getFullYear(), new Date().getMonth()+1, 0) };
    var cats = categoryTotalsInRange(range.from, range.to, 'saida', null).slice(0,5);
    html += '<div class="section-title">Maiores gastos do mês</div>';
    if(cats.length === 0){
      html += '<div class="empty">Nenhum gasto lançado neste mês ainda.</div>';
    }else{
      var max = cats[0][1];
      html += '<div>' + cats.map(function(c){
        return '<div class="report-row"><div class="report-head"><span class="report-cat">'+esc(c[0])+'</span><span class="report-val">'+fmtBRL(c[1])+'</span></div>'
          + '<div class="bar-track"><div class="bar-fill" style="width:'+Math.max(4,(c[1]/max*100))+'%"></div></div></div>';
      }).join('') + '</div>';
    }
    return html;
  }

  // ---------- vencimentos ----------
  function renderVencimentos(){
    var html = '<div class="form-row" style="margin-bottom:14px;">'
      + '<div><label>Ordenar por</label><select data-action="vencimentos-sort-change">'
      + '<option value="status" '+(state.vencimentosSort==='status'?'selected':'')+'>Urgência</option>'
      + '<option value="data" '+(state.vencimentosSort==='data'?'selected':'')+'>Data</option>'
      + '<option value="valor" '+(state.vencimentosSort==='valor'?'selected':'')+'>Valor</option>'
      + '</select></div>'
      + '<div><label>Mês</label><select data-action="vencimentos-month-change">'
      + '<option value="todos" '+(state.vencimentosMonth==='todos'?'selected':'')+'>Todos</option>'
      + '<option value="anterior" '+(state.vencimentosMonth==='anterior'?'selected':'')+'>Mês anterior</option>'
      + '<option value="atual" '+(state.vencimentosMonth==='atual'?'selected':'')+'>Mês atual</option>'
      + '<option value="proximo" '+(state.vencimentosMonth==='proximo'?'selected':'')+'>Próximo mês</option>'
      + '</select></div></div>';

    var reminders = sortReminders(getReminders(state.vencimentosMonth), state.vencimentosSort);
    if(reminders.length === 0){
      html += '<div class="empty">Nada encontrado com esses filtros.</div>';
    }else{
      html += '<div class="list">' + reminders.map(function(r){
        return '<div class="list-item"><div class="li-main"><div class="li-title">'+esc(r.title)+'</div><div class="li-sub">'+esc(r.sub)+'</div></div>'
          + '<span class="badge '+r.status.cls+'">'+r.status.label+'</span><div class="li-value">'+fmtBRL(r.value)+'</div></div>';
      }).join('') + '</div>';
    }
    html += '<div class="settings-note" style="margin-top:16px;">Essa lista junta as contas fixas (mês anterior, atual e próximo), a fatura em aberto, a última fatura fechada e qualquer fatura antiga que ainda tenha saldo a pagar. Em \"Todos\", o que já foi pago em meses passados fica oculto. Para pagar uma fatura, use a aba Cartões. Para lançar uma conta fixa, use a aba Contas Fixas.</div>';
    return html;
  }

  // ---------- transactions ----------
  function renderTransactions(){
    var d = state.txDraft;
    var isTransfer = d.tipo === 'transferencia';
    var isReceita = d.tipo === 'entrada';
    var isEditing = state.editing.type === 'transaction';
    var formaList = (isReceita ? FORMAS_RECEITA : FORMAS).slice();
    // ao editar, mantem formas especiais (ex.: Boleto / Debito automatico vindos de contas fixas)
    if(isEditing && !isTransfer && d.forma && formaList.indexOf(d.forma) === -1) formaList.push(d.forma);
    if(!isTransfer && formaList.indexOf(d.forma) === -1) d.forma = formaList[0];
    var isCard = !isTransfer && d.forma === 'Cartão de Crédito';
    var isPresente = d.tipo === 'presente';
    var categoryList = isReceita ? state.incomeCategories : (isPresente ? PRESENTE_CATEGORIES : state.categories);
    if(isEditing && d.category && categoryList.indexOf(d.category) === -1) categoryList = categoryList.concat([d.category]);
    var editingT = isEditing ? state.transactions.filter(function(t){return t.id===state.editing.id;})[0] : null;
    var descHint = !isEditing ? findAutocompleteMatch(d.desc) : null;

    var html = '<div class="section-title">'+(isEditing?'Editar lançamento':'Novo lançamento')+'</div>';
    html += '<form class="inline-form" data-form="transaction">'
      + '<input type="hidden" name="id" value="'+(isEditing?state.editing.id:'')+'">'
      + '<div class="form-row">'
      + '<div><label>Tipo</label><select name="tipo" data-action="tipo-change">'+TIPOS.map(function(t){ return '<option value="'+t.v+'" '+(d.tipo===t.v?'selected':'')+'>'+t.l+'</option>'; }).join('')+'</select></div>'
      + (isTransfer ? '' : '<div><label>Forma de pagamento</label><select name="forma" data-action="forma-change">'+optionsHTML(formaList, formaList.indexOf(d.forma)!==-1?d.forma:formaList[0])+'</select></div>')
      + '<div><label>Valor (R$)</label><input type="number" step="0.01" min="0.01" name="value" required value="'+esc(d.value)+'"></div>'
      + '</div>'
      + '<div class="form-row date-row"><div class="date-field"><label>Data</label><input type="date" name="date" required value="'+esc(d.date)+'"></div></div>'
      + '<div class="form-row">'
      + '<div><label>Descrição'+(isTransfer?' (opcional)':'')+'</label><input list="desc-list" type="text" name="desc" placeholder="Ex: Spotify" '+(isTransfer?'':'required')+' autocomplete="off" value="'+esc(d.desc)+'">'
      +   '<datalist id="desc-list">'+ Array.from(new Set(state.transactions.map(function(t){return t.desc;}))).map(function(x){return '<option value="'+esc(x)+'">';}).join('') +'</datalist>'
      +   '<div class="autocomplete-hint" id="autocomplete-hint" style="'+(descHint?'':'display:none;')+'">Igual a um lançamento anterior - categoria preenchida automaticamente. Ajuste se precisar.</div>'
      + '</div>'
      + (isTransfer ? '' : '<div><label>Categoria</label><select name="category" required>'+ (categoryList.length ? optionsHTML(categoryList, categoryList.indexOf(d.category)!==-1?d.category:(descHint&&categoryList.indexOf(descHint.category)!==-1?descHint.category:categoryList[0])) : '<option value="">Cadastre categorias em Ajustes</option>') +'</select></div>')
      + '</div>'
      + '<div class="form-row">';

    if(isCard){
      html += '<div><label>Cartão</label><select name="cardId" data-action="card-select-change">'+ (state.cards.length ? state.cards.map(function(c){ return '<option value="'+c.id+'" '+((d.cardId===c.id)||(!d.cardId && descHint && descHint.cardId===c.id)?'selected':'')+'>'+esc(c.name)+(c.titular?' ('+esc(c.titular)+')':'')+'</option>'; }).join('') : '<option value="">Cadastre um cartão primeiro</option>') +'</select></div>'
        + (isEditing ? '' : '<div><label>Parcelas</label><input type="number" name="installments" min="1" max="24" value="'+esc(d.installments||'1')+'"></div>')
        + cycleSelectHTML();
      if(isEditing && editingT && editingT.installmentGroupId){
        html += '<div class="checkbox-row" style="grid-column:1/-1;"><input type="checkbox" id="applyToFollowing" name="applyToFollowing" '+(d.applyToFollowing?'checked':'')+'><label for="applyToFollowing">Aplicar valor/descrição/categoria também às parcelas seguintes desta compra</label></div>';
      }
    }else if(isTransfer){
      html += '<div><label>Conta de origem</label><select name="origemId">'+ (state.accounts.length ? state.accounts.map(function(a){ return '<option value="'+a.id+'" '+(d.origemId===a.id?'selected':'')+'>'+esc(a.name)+(a.titular?' ('+esc(a.titular)+')':'')+'</option>'; }).join('') : '<option value="">Cadastre uma conta primeiro</option>') +'</select></div>'
        + '<div><label>Conta de destino</label><select name="destinoId">'+ (state.accounts.length ? state.accounts.map(function(a){ return '<option value="'+a.id+'" '+(d.destinoId===a.id?'selected':'')+'>'+esc(a.name)+(a.titular?' ('+esc(a.titular)+')':'')+'</option>'; }).join('') : '<option value="">Cadastre uma conta primeiro</option>') +'</select></div>';
    }else{
      html += '<div><label>Conta</label><select name="accountId">'+ (state.accounts.length ? state.accounts.map(function(a){ return '<option value="'+a.id+'" '+((d.accountId===a.id)||(!d.accountId && descHint && descHint.accountId===a.id)?'selected':'')+'>'+esc(a.name)+(a.titular?' ('+esc(a.titular)+')':'')+'</option>'; }).join('') : '<option value="">Cadastre uma conta primeiro</option>') +'</select></div>';
    }
    html += '</div>';

    html += '<div class="form-actions">'
      + (isEditing ? '<button type="button" class="btn btn-ghost" data-action="cancel-edit">Cancelar</button>' : '')
      + '<button type="submit" class="btn btn-primary">'+(isEditing?'Salvar alterações':'Adicionar lançamento')+'</button>'
      + '</div></form>';

    var tf = state.txFilter;
    var tfCats = categoryListForTipo(tf.tipo);
    html += '<div class="section-title">Histórico</div>';
    html += '<div class="form-row" style="margin-bottom:10px;">'
      + '<div><label>Mês</label><div class="month-picker"><button type="button" data-action="tx-month-prev">&lt;</button><span class="label">'+(state.txMonth==='todos'?'Todos os meses':monthLabel(state.txMonth))+'</span><button type="button" data-action="tx-month-next">&gt;</button></div></div>'
      + '<div><label>&nbsp;</label><button type="button" class="btn btn-ghost btn-small" data-action="tx-month-all">Ver todos os meses</button></div>'
      + '</div>';
    html += '<div class="form-row" style="margin-bottom:10px;">'
      + '<div><label>Filtrar tipo</label><select data-action="tx-filter-tipo"><option value="">Todos</option>'+ TIPOS.map(function(o){ return '<option value="'+o.v+'" '+(tf.tipo===o.v?'selected':'')+'>'+o.l+'</option>'; }).join('') +'</select></div>'
      + '<div><label>Filtrar categoria</label><select data-action="tx-filter-categoria"><option value="">Todas</option>'+optionsHTML(tfCats, tf.categoria)+'</select></div>'
      + '<div><label>Filtrar conta</label><select data-action="tx-filter-conta"><option value="">Todas</option>'+ state.accounts.map(function(a){return '<option value="'+a.id+'" '+(tf.conta===a.id?'selected':'')+'>'+esc(a.name)+'</option>';}).join('') +'</select></div>'
      + '<div><label>Filtrar cartão</label><select data-action="tx-filter-cartao"><option value="">Todos</option>'+ state.cards.map(function(c){return '<option value="'+c.id+'" '+(tf.cartao===c.id?'selected':'')+'>'+esc(c.name)+'</option>';}).join('') +'</select></div>'
      + '</div>';

    var seenTransfer = {};
    var all = state.transactions.filter(function(t){ return matchesFilter(t, tf) && matchesTipoFilter(t, tf.tipo); }).filter(function(t){
      if(state.txMonth !== 'todos' && t.date.slice(0,7) !== state.txMonth) return false;
      if(t.isTransfer){ if(seenTransfer[t.transferId]) return false; seenTransfer[t.transferId] = true; }
      return true;
    });
    var sorted = all.sort(function(a,b){ return b.date.localeCompare(a.date); });

    if(sorted.length===0){
      html += '<div class="empty">Nenhum lançamento encontrado com esses filtros.</div>';
    }else{
      html += '<div class="list">' + sorted.map(function(t){
        var delKey = 'transaction:'+t.id;
        var confirming = state.confirmingDeleteKey === delKey;
        var groupDelKey = 'transaction-group:'+t.id;
        var confirmingGroup = state.confirmingDeleteKey === groupDelKey;

        if(t.isTransfer){
          var pair = state.transactions.filter(function(x){return x.transferId===t.transferId;});
          var saidaLeg = pair.filter(function(x){return x.tipo==='saida';})[0] || t;
          var entradaLeg = pair.filter(function(x){return x.tipo==='entrada';})[0];
          var origemAcc = state.accounts.filter(function(a){return a.id===saidaLeg.accountId;})[0];
          var destinoAcc = entradaLeg ? state.accounts.filter(function(a){return a.id===entradaLeg.accountId;})[0] : null;
          return '<div class="list-item"><div class="li-main"><div class="li-title">'+esc(saidaLeg.desc)+' <span class="tag">transferência</span></div>'
            + '<div class="li-sub">'+fmtDate(saidaLeg.date)+' - '+esc(origemAcc?origemAcc.name:'-')+' &rarr; '+esc(destinoAcc?destinoAcc.name:'-')+'</div></div>'
            + '<div class="li-value transfer">'+fmtBRL(saidaLeg.value)+'</div>'
            + '<div class="li-actions"><button type="button" class="icon-btn" data-action="edit-transaction" data-id="'+saidaLeg.id+'">Editar</button>'
            + '<button type="button" class="icon-btn '+(confirming?'confirm':'danger')+'" data-action="delete-transaction" data-id="'+saidaLeg.id+'">'+(confirming?'Confirmar':'Excluir')+'</button></div></div>';
        }

        var place='-';
        if(t.cardId){ var cc=state.cards.filter(function(c){return c.id===t.cardId;})[0]; place = cc?cc.name:'-'; }
        else if(t.accountId){ var ac=state.accounts.filter(function(a){return a.id===t.accountId;})[0]; place = ac?ac.name:'-'; }
        var parcelaTxt = t.installment ? (' <span class="tag">'+t.installment.current+'/'+t.installment.total+'</span>') : '';
        var billTag = t.billId ? ' <span class="tag">conta fixa</span>' : (isInvoicePayment(t) ? ' <span class="tag">pagamento de fatura</span>' : '');
        var sign = t.tipo==='entrada' ? '+' : '-';
        var groupBtn = t.installmentGroupId ? ('<button type="button" class="icon-btn '+(confirmingGroup?'confirm':'danger')+'" data-action="delete-transaction-group" data-id="'+t.id+'">'+(confirmingGroup?'Confirmar':'Excluir esta e as seguintes')+'</button>') : '';
        return '<div class="list-item"><div class="li-main"><div class="li-title">'+esc(t.desc)+parcelaTxt+billTag+'</div>'
          + '<div class="li-sub">'+fmtDate(t.date)+' - '+esc(t.category)+' - '+esc(t.forma)+' - '+esc(place)+'</div></div>'
          + '<div class="li-value '+t.tipo+'">'+sign+fmtBRL(t.value)+'</div>'
          + '<div class="li-actions">'+(isInvoicePayment(t) ? '' : '<button type="button" class="icon-btn" data-action="edit-transaction" data-id="'+t.id+'">Editar</button>')
          + '<button type="button" class="icon-btn '+(confirming?'confirm':'danger')+'" data-action="delete-transaction" data-id="'+t.id+'">'+(confirming?'Confirmar':'Excluir')+'</button>'
          + groupBtn + '</div></div>';
      }).join('') + '</div>';
    }
    return html;
  }

  function cycleSelectHTML(){
    var d = state.txDraft;
    var card = state.cards.filter(function(c){ return c.id===d.cardId; })[0] || state.cards[0];
    if(!card) return '';
    var refDate = toLocalDate(d.date || todayISO());
    var autoCycle = invoiceCycleForDate(card, refDate);
    var currentVal = d.invoiceCycleOverride || cycleKey(autoCycle);
    var options = nearbyCycles(card, refDate, 1, 3).map(function(c){
      var k = cycleKey(c);
      var due = invoiceDueDate(card, c);
      var label = fmtDateShort(due) + (k===cycleKey(autoCycle)?' (sugerida)':'');
      return '<option value="'+k+'" '+(k===currentVal?'selected':'')+'>'+label+'</option>';
    }).join('');
    return '<div><label>Fatura de destino</label><select name="invoiceCycleOverride">'+options+'</select></div>';
  }

  function refreshCycleOptions(form){
    if(!form) return;
    var select = form.querySelector('select[name="invoiceCycleOverride"]');
    var cardSel = form.querySelector('select[name="cardId"]');
    if(!select || !cardSel) return;
    var card = state.cards.filter(function(c){ return c.id===cardSel.value; })[0];
    if(!card) return;
    var dateInput = form.querySelector('input[name="date"]');
    var refDate = toLocalDate(dateInput && dateInput.value ? dateInput.value : todayISO());
    var autoCycle = invoiceCycleForDate(card, refDate);
    select.innerHTML = nearbyCycles(card, refDate, 1, 3).map(function(c){
      var k = cycleKey(c);
      var due = invoiceDueDate(card, c);
      var label = fmtDateShort(due) + (k===cycleKey(autoCycle)?' (sugerida)':'');
      return '<option value="'+k+'" '+(k===cycleKey(autoCycle)?'selected':'')+'>'+label+'</option>';
    }).join('');
    state.txDraft.invoiceCycleOverride = select.value;
  }

  // ---------- accounts ----------
  function renderAccounts(){
    var editingA = state.editing.type==='account' ? state.accounts.filter(function(a){return a.id===state.editing.id;})[0] : null;
    var titularOpts = allTitulares().map(function(t){return '<option value="'+esc(t)+'">';}).join('');
    var html = '<div class="section-title">'+(editingA?'Editar conta':'Nova conta')+'</div>';
    html += '<form class="inline-form" data-form="account">'
      + '<input type="hidden" name="id" value="'+(editingA?editingA.id:'')+'">'
      + '<div class="form-row">'
      + '<div><label>Nome da conta</label><input type="text" name="name" placeholder="Ex: Nubank, Carteira" required value="'+(editingA?esc(editingA.name):'')+'"></div>'
      + '<div><label>Titular</label><input list="titular-list" name="titular" placeholder="Ex: Guilherme" value="'+(editingA?esc(editingA.titular||''):'')+'"><datalist id="titular-list">'+titularOpts+'</datalist></div>'
      + '<div><label>Saldo inicial (R$)</label><input type="number" step="0.01" name="saldoInicial" value="'+(editingA?editingA.saldoInicial:'0')+'"></div>'
      + '</div>'
      + '<div class="checkbox-row"><input type="checkbox" id="isInvestment" name="isInvestment" '+(editingA&&editingA.isInvestment?'checked':'')+'><label for="isInvestment">Esta conta é um investimento (não soma no saldo total)</label></div>'
      + '<div class="form-actions">'+(editingA?'<button type="button" class="btn btn-ghost" data-action="cancel-edit">Cancelar</button>':'')+'<button type="submit" class="btn btn-primary">'+(editingA?'Salvar alterações':'Adicionar conta')+'</button></div></form>';

    html += '<div class="section-title">Suas contas</div>';
    var accs = state.accounts.filter(function(a){ return passesOwnerFilter(a.titular); });
    if(accs.length===0){
      html += '<div class="empty">Nenhuma conta '+(state.filterTitular?'de '+esc(state.filterTitular)+' ':'')+'cadastrada ainda.</div>';
    }else{
      html += '<div class="list">' + accs.map(function(a){
        var bal = accountBalance(a);
        var delKey = 'account:'+a.id;
        var confirming = state.confirmingDeleteKey === delKey;
        var tag = a.isInvestment ? '<span class="tag">Investimento</span>' : '';
        return '<div class="list-item" style="border-left-color:'+ownerColor(a.titular)+'"><div class="li-main"><div class="li-title"><span class="owner-dot" style="background:'+ownerColor(a.titular)+'"></span> '+esc(a.name)+(a.titular?' ('+esc(a.titular)+')':'')+tag+'</div><div class="li-sub">Saldo inicial: '+fmtBRL(a.saldoInicial)+'</div></div>'
          + '<div class="li-value" style="color:'+(bal<0?'var(--red)':'var(--text)')+'">'+fmtBRL(bal)+'</div>'
          + '<div class="li-actions"><button type="button" class="icon-btn" data-action="edit-account" data-id="'+a.id+'">Editar</button>'
          + '<button type="button" class="icon-btn '+(confirming?'confirm':'danger')+'" data-action="delete-account" data-id="'+a.id+'">'+(confirming?'Confirmar':'Excluir')+'</button></div></div>';
      }).join('') + '</div>';
    }
    return html;
  }

  // ---------- cards ----------
  function renderCards(){
    var editingC = state.editing.type==='card' ? state.cards.filter(function(c){return c.id===state.editing.id;})[0] : null;
    var titularOpts = allTitulares().map(function(t){return '<option value="'+esc(t)+'">';}).join('');
    var html = '<div class="section-title">'+(editingC?'Editar cartão':'Novo cartão')+'</div>';
    html += '<form class="inline-form" data-form="card">'
      + '<input type="hidden" name="id" value="'+(editingC?editingC.id:'')+'">'
      + '<div class="form-row">'
      + '<div><label>Nome do cartão</label><input type="text" name="name" placeholder="Ex: Nubank, Inter" required value="'+(editingC?esc(editingC.name):'')+'"></div>'
      + '<div><label>Titular</label><input list="titular-list" name="titular" placeholder="Ex: Ana Julia" value="'+(editingC?esc(editingC.titular||''):'')+'"><datalist id="titular-list">'+titularOpts+'</datalist></div>'
      + '</div>'
      + '<div class="form-row">'
      + '<div><label>Dia de fechamento</label><input type="number" name="closingDay" min="1" max="31" required value="'+(editingC?editingC.closingDay:'')+'"></div>'
      + '<div><label>Dia de vencimento</label><input type="number" name="dueDay" min="1" max="31" required value="'+(editingC?editingC.dueDay:'')+'"></div>'
      + '<div><label>Limite total (R$)</label><input type="number" step="0.01" name="limit" value="'+(editingC?editingC.limit:'0')+'"></div>'
      + '</div>'
      + '<div class="settings-note">Se o dia de fechamento ou de vencimento cair em fim de semana ou feriado nacional, o app empurra automaticamente para o próximo dia útil.</div>'
      + '<div class="form-actions">'+(editingC?'<button type="button" class="btn btn-ghost" data-action="cancel-edit">Cancelar</button>':'')+'<button type="submit" class="btn btn-primary">'+(editingC?'Salvar alterações':'Adicionar cartão')+'</button></div></form>';

    html += '<div class="section-title">Seus cartões</div>';
    var crds = state.cards.filter(function(c){ return passesOwnerFilter(c.titular); });
    if(crds.length===0){
      html += '<div class="empty">Nenhum cartão '+(state.filterTitular?'de '+esc(state.filterTitular)+' ':'')+'cadastrado ainda.</div>';
    }else{
      html += crds.map(function(c){
        var delKey = 'card:'+c.id;
        var confirming = state.confirmingDeleteKey === delKey;
        var expanded = !!state.expandedCards[c.id];
        var limiteDisp = (c.limit || 0) - pendingTotal(c);

        var block = '<div class="card">'
          + '<div class="card-head" data-action="toggle-card-expand" data-id="'+c.id+'">'
          + '<div><div class="li-title"><span class="owner-dot" style="background:'+ownerColor(c.titular)+'"></span> '+esc(c.name)+(c.titular?' ('+esc(c.titular)+')':'')+'</div>'
          + '<div class="li-sub">Fecha dia '+(c.closingDay||'-')+' - Vence dia '+(c.dueDay||'-')+' - Limite disp.: '+fmtBRL(limiteDisp)+'</div></div>'
          + '<button type="button" class="expand-btn" data-action="toggle-card-expand" data-id="'+c.id+'">'+(expanded?'&#9650;':'&#9660;')+'</button>'
          + '</div>';

        if(expanded){
          block += '<div class="li-actions" style="margin-top:10px;"><button type="button" class="icon-btn" data-action="edit-card" data-id="'+c.id+'">Editar</button>'
            + '<button type="button" class="icon-btn '+(confirming?'confirm':'danger')+'" data-action="delete-card" data-id="'+c.id+'">'+(confirming?'Confirmar':'Excluir')+'</button></div>';

          var cycles = nearbyCycles(c, new Date(), 1, 2);
          block += '<div class="section-title" style="font-size:13px;margin:16px 0 8px;">Próximas faturas</div>';
          block += '<div class="list">' + cycles.map(function(cyc){
            var ck = cycleKey(cyc);
            var total = cardInvoiceTotal(c, ck);
            var paid = cyclePaid(c, ck);
            var restante = total - paid;
            var due = invoiceDueDate(c, cyc);
            var isFuture = ck > openCycleKey(c);
            var label = ck === openCycleKey(c) ? 'Em aberto (parcial)' : (ck < openCycleKey(c) ? 'Fechada' : 'Futura (só parcelas já lançadas)');
            var badge = restante <= 0 && total > 0 ? '<span class="badge paid">Paga</span>' : (ck < openCycleKey(c) && total > 0 ? '<span class="badge '+computeStatus(due, paid/(total||1)).cls+'">'+computeStatus(due, paid/(total||1)).label+'</span>' : '');
            var row = '<div class="list-item"><div class="li-main"><div class="li-title">'+label+' - '+monthLabel(ck)+'</div><div class="li-sub">Vence em '+fmtDateObj(due)+(paid>0?' - já pago: '+fmtBRL(paid):'')+'</div></div>'
              + badge + '<div class="li-value">'+fmtBRL(Math.max(0,restante))+'</div></div>';
            if(restante > 0 && !isFuture){
              var accOpts = state.accounts.map(function(a){return '<option value="'+a.id+'">'+esc(a.name)+(a.titular?' ('+esc(a.titular)+')':'')+'</option>';}).join('');
              var isPaying = state.payingCycle === (c.id+':'+ck);
              if(isPaying){
                row += '<form class="inline-form" data-form="pay-invoice" data-card-id="'+c.id+'" data-cycle="'+ck+'" style="margin-top:0;">'
                  + '<div class="form-row"><div><label>Conta</label><select name="accountId" required>'+(state.accounts.length?accOpts:'<option value="">Cadastre uma conta primeiro</option>')+'</select></div>'
                  + '<div><label>Valor a pagar (R$)</label><input type="number" step="0.01" min="0.01" max="'+restante.toFixed(2)+'" name="amount" value="'+restante.toFixed(2)+'" required></div></div>'
                  + '<div class="form-actions"><button type="button" class="btn btn-ghost btn-small" data-action="cancel-pay">Cancelar</button><button type="submit" class="btn btn-primary btn-small">Confirmar pagamento</button></div></form>';
              }else{
                row += '<div class="form-actions" style="margin-top:-4px;"><button type="button" class="btn btn-ghost btn-small" data-action="start-pay" data-card-id="'+c.id+'" data-cycle="'+ck+'">Pagar</button></div>';
              }
            }
            return row;
          }).join('') + '</div>';
        }
        block += '</div>';
        return block;
      }).join('');
    }
    return html;
  }

      + '</div>'
      + '<div class="form-row">'
      + (isReceita

          : (formaSel==='cartao'
              ? '<div><label>Cartão</label><select name="cardId">'+(state.cards.length?state.cards.map(function(c){return '<option value="'+c.id+'" '+(d.cardId===c.id?'selected':'')+'>'+esc(c.name)+'</option>';}).join(''):'<option value="">Cadastre um cartão primeiro</option>')+'</select></div>'
              : '<div><label>Conta padrão</label><select name="accountId">'+ (state.accounts.length?('<option value="">Escolher na hora de lançar</option>'+state.accounts.map(function(a){return '<option value="'+a.id+'" '+(d.accountId===a.id?'selected':'')+'>'+esc(a.name)+'</option>';}).join('')):'<option value="">Cadastre uma conta primeiro</option>')+'</select></div>'))

      });
      html += '<div class="summary-grid">'
        + '<div class="mini-card"><div class="name">Despesas fixas</div><div class="val" style="color:var(--red)">'+fmtBRL(totDesp)+'</div></div>'
        + '<div class="mini-card"><div class="name">Já pago</div><div class="val">'+fmtBRL(pagoDesp)+'</div></div>'
        + '<div class="mini-card"><div class="name">Falta pagar</div><div class="val '+(totDesp-pagoDesp>0?'neg':'')+'">'+fmtBRL(totDesp-pagoDesp)+'</div></div>'
        + (totRec>0 ? '<div class="mini-card"><div class="name">Receitas fixas (recebido)</div><div class="val" style="color:var(--green)">'+fmtBRL(totRec)+' <span style="font-size:11px;color:var(--text-dim)">('+fmtBRL(recebido)+')</span></div></div>' : '')

        var sb = computeStatus(fixedBillDueDate(b,bm), billIsPaidInMonth(b,bm)?1:0);
        if(sa.order!==sb.order) return sa.order-sb.order;
        return a.dueDay-b.dueDay;
      });
      html += '<div class="list">' + sorted.map(function(b){
        var paidThisMonth = billIsPaidInMonth(b, bm);

        var confirming = state.confirmingDeleteKey === delKey;
        var parc = billParcelaLabel(b, bm);
        var parcelaInfo = parc ? ' <span class="tag">'+parc+'</span>' : '';
