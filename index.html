<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JETRO</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JETRO">
<meta name="theme-color" content="#0B1220">
<link rel="apple-touch-icon" href="icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');
  :root{
    --bg:#0B1220; --panel:#131C2E; --panel-2:#17233A; --border:#24304A;
    --text:#EDF1F7; --text-dim:#8A93A6; --text-faint:#5A6478;
    --green:#34D399; --green-dim:#1F5C48; --red:#FB7676; --red-dim:#5C2A2A;
    --amber:#FBBF24; --amber-dim:#5C4A1A; --accent:#6EE7C7; --accent2:#60A5FA;
    --radius:12px; --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; touch-action:pan-x pan-y; }
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); -webkit-font-smoothing:antialiased; min-height:100vh; }
  #app{ max-width:1000px; margin:0 auto; padding:20px 16px 60px; }
  a, button{ font-family:inherit; }
  button{ cursor:pointer; }
  .app-header{ margin-bottom:20px; }
  .app-title-row{ display:flex; align-items:center; gap:10px; margin:0 0 12px; flex-wrap:wrap; }
  .hamburger-btn{ background:var(--panel); border:1px solid var(--border); color:var(--text); border-radius:8px; width:38px; height:34px; font-size:16px; flex-shrink:0; }
  .app-title{ font-family:var(--font-display); font-weight:700; font-size:15px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-dim); flex:1; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  .save-status{ font-size:11px; color:var(--text-faint); text-transform:none; letter-spacing:0; font-family:var(--font-body); }
  .header-actions{ display:flex; align-items:center; gap:10px; }
  .hero{ background:linear-gradient(145deg,var(--panel),var(--panel-2)); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px; display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .hero-label{ font-size:13px; color:var(--text-dim); margin-bottom:4px; }
  .hero-value{ font-family:var(--font-mono); font-weight:600; font-size:clamp(24px,5vw,34px); letter-spacing:-0.02em; }
  .hero-value.neg{ color:var(--red); }
  .hero-value.pos{ color:var(--text); }
  .hero-sub{ font-size:12px; color:var(--text-faint); font-family:var(--font-mono); }

  .nav-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:40; }
  .nav-panel{ position:fixed; top:0; left:0; bottom:0; width:250px; max-width:80vw; background:var(--panel); border-right:1px solid var(--border); z-index:41; padding:16px 10px; overflow-y:auto; }
  .nav-panel-title{ font-family:var(--font-display); font-weight:700; font-size:16px; padding:8px 10px 16px; letter-spacing:.04em; }
  .nav-item{ display:block; width:100%; text-align:left; background:none; border:none; color:var(--text-dim); font-family:var(--font-display); font-weight:600; font-size:14px; padding:12px 10px; border-radius:8px; margin-bottom:2px; }
  .nav-item.active{ color:var(--accent); background:var(--panel-2); }

  .section-title{ font-family:var(--font-display); font-weight:600; font-size:16px; margin:24px 0 10px; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .section-title:first-child{ margin-top:0; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px; }
  .grid-2{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px; }
  .card{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:12px; }
  .mini-card{ background:var(--panel); border:1px solid var(--border); border-left:3px solid var(--border); border-radius:10px; padding:12px 14px; }
  .mini-card .name{ font-size:12px; color:var(--text-dim); margin-bottom:6px; display:flex; align-items:center; gap:6px; }
  .mini-card .val{ font-family:var(--font-mono); font-weight:600; font-size:17px; }
  .mini-card .val.neg{ color:var(--red); }
  .owner-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0; }
  .empty{ color:var(--text-faint); font-size:13px; padding:18px 4px; border:1px dashed var(--border); border-radius:var(--radius); text-align:center; }
  form.inline-form{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px; display:grid; gap:10px; margin-bottom:16px; }
  .form-row{ display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); }
  .form-row > div{ min-width:0; }
  label{ font-size:11px; color:var(--text-dim); display:block; margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em; }
  input, select{ width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:9px 10px; font-size:14px; font-family:var(--font-body); min-width:0; }
  input[type="number"]{ font-family:var(--font-mono); }
  input[type="date"]{ min-width:0; }
  input[type="color"]{ padding:2px; height:36px; }
  .checkbox-row{ display:flex; align-items:center; gap:8px; }
  .checkbox-row input{ width:auto; }
  .checkbox-row label{ margin:0; text-transform:none; font-size:13px; color:var(--text); }
  .btn{ border-radius:8px; padding:9px 16px; font-size:13px; font-weight:600; border:1px solid var(--border); background:var(--panel-2); color:var(--text); }
  .btn-primary{ background:var(--green); border-color:var(--green); color:#04241A; }
  .btn-ghost{ background:none; border:1px solid var(--border); color:var(--text-dim); }
  .btn-small{ padding:6px 12px; font-size:12px; }
  .form-actions{ display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
  .list{ display:flex; flex-direction:column; gap:8px; }
  .list-item{ background:var(--panel); border:1px solid var(--border); border-left:3px solid var(--border); border-radius:10px; padding:10px 12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .li-main{ flex:1; min-width:160px; }
  .li-title{ font-size:14px; font-weight:500; }
  .li-sub{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .li-value{ font-family:var(--font-mono); font-weight:600; font-size:14px; white-space:nowrap; }
  .li-value.saida{ color:var(--red); }
  .li-value.entrada{ color:var(--green); }
  .li-value.presente, .li-value.investimento, .li-value.transfer{ color:var(--accent2); }
  .li-actions{ display:flex; gap:6px; flex-wrap:wrap; }
  .icon-btn{ background:none; border:1px solid var(--border); color:var(--text-faint); border-radius:7px; padding:5px 10px; font-size:12px; font-family:var(--font-body); }
  .icon-btn.danger{ color:var(--red); }
  .icon-btn.confirm{ color:#fff; background:var(--red); border-color:var(--red); font-weight:700; }
  .badge{ font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:3px 8px; border-radius:999px; white-space:nowrap; }
  .badge.late{ background:var(--red-dim); color:var(--red); }
  .badge.soon{ background:var(--amber-dim); color:var(--amber); }
  .badge.upcoming{ background:var(--panel-2); color:var(--text-dim); border:1px solid var(--border); }
  .badge.paid{ background:var(--green-dim); color:var(--green); }
  .tag{ font-size:10px; padding:2px 7px; border-radius:999px; background:var(--panel-2); color:var(--text-dim); border:1px solid var(--border); margin-left:6px; }
  .report-row{ display:grid; gap:6px; margin-bottom:12px; }
  .report-head{ display:flex; justify-content:space-between; font-size:13px; }
  .report-cat{ font-weight:500; }
  .report-val{ font-family:var(--font-mono); color:var(--text-dim); }
  .bar-track{ height:8px; background:var(--panel-2); border-radius:999px; overflow:hidden; border:1px solid var(--border); }
  .bar-fill{ height:100%; background:linear-gradient(90deg,var(--accent),var(--green)); }
  .bar-fill.over{ background:linear-gradient(90deg,var(--amber),var(--red)); }
  .month-picker{ display:flex; align-items:center; gap:8px; margin-bottom:0; }
  .month-picker button{ background:var(--panel); border:1px solid var(--border); color:var(--text); border-radius:8px; width:34px; height:30px; font-size:13px; }
  .month-picker .label{ font-family:var(--font-mono); font-weight:600; font-size:14px; min-width:120px; text-align:center; text-transform:capitalize; }
  .settings-block{ margin-top:30px; padding-top:16px; border-top:1px solid var(--border); }
  .settings-note{ font-size:12px; color:var(--text-faint); margin-bottom:10px; }
  .loading, .setup-notice{ text-align:center; color:var(--text-dim); padding:60px 20px; font-size:13px; }
  .setup-notice code{ background:var(--panel); border:1px solid var(--border); padding:2px 6px; border-radius:5px; font-family:var(--font-mono); }
  .export-status{ font-size:12px; color:var(--text-dim); margin-top:8px; }
  .export-surface{ background:var(--bg); padding:6px; border-radius:8px; }
  .chart-wrap{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px; }
  .chart-wrap canvas{ max-height:260px; }
  .summary-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-bottom:16px; }
  .autocomplete-hint{ font-size:11px; color:var(--accent); margin-top:4px; }
  .card-head{ display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:8px; cursor:pointer; }
  .expand-btn{ background:var(--panel-2); border:1px solid var(--border); color:var(--text-dim); border-radius:7px; width:30px; height:30px; font-size:13px; flex-shrink:0; }
  @media (max-width:480px){ .hero{ padding:16px; } }
</style>
</head>
<body>
<div id="app"><div class="loading">Carregando seus dados...</div></div>
<script>
(function(){
  'use strict';

  // ======================================================================
  // CONFIGURACAO -- cole aqui a URL do seu Google Apps Script (termina em /exec)
  // ======================================================================
  var CONFIG = { API_URL: 'https://script.google.com/macros/s/AKfycbyvINh2L6mPb0AR5snpsuxnjHrw15e9JyGFni8LUe76rPBGkMP2W_H3eKHbmchPsVP8/exec' };
  // ======================================================================

  var DEFAULT_CATEGORIES = ['Alimentação','Mercado','Transporte','Moradia','Lazer','Saúde','Educação','Assinaturas','Vestuário','Pets','Presentes','Outros'];
  var FORMAS = ['Cartão de Crédito','Pix','Débito','Dinheiro','Transferência'];
  var PAGAMENTO_FATURA_FORMA = 'Pagamento de Fatura';
  var TIPOS = [
    { v:'saida', l:'Saída (gasto)' },
    { v:'entrada', l:'Entrada (receita)' },
    { v:'presente', l:'Presente / Doação' },
    { v:'investimento', l:'Investimento' }
  ];
  var MONTHS_PT = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  var MONTHS_SHORT_PT = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  var TITULARES_PADRAO = ['Guilherme','Ana Julia'];
  var DEFAULT_COLORS = { 'Guilherme': '#60A5FA', 'Ana Julia': '#F472B6' };
  var FORMA_FIXA = [
    { v:'debito_automatico', l:'Débito automático' },
    { v:'cartao', l:'Desconta no cartão' },
    { v:'boleto', l:'Boleto avulso' }
  ];
  var NAV_TABS = [['overview','Visão geral'],['vencimentos','Vencimentos'],['transactions','Lançamentos'],['accounts','Contas'],['cards','Cartões'],['bills','Contas fixas'],['report','Relatório'],['settings','Ajustes']];

  function freshTxDraft(){ return { value:'', date: todayISO(), desc:'', category: '', forma: FORMAS[0], tipo:'saida', accountId:'', cardId:'', origemId:'', destinoId:'', installments:'1', invoiceCycleOverride:'', applyToFollowing:false }; }
  function freshBillDraft(){ return { name:'', natureza:'despesa', value:'', dueDay:'', tipoRecorrencia:'eterna', totalParcelas:'12', forma:'debito_automatico', cardId:'', accountId:'' }; }

  var state = {
    tab: 'overview',
    navOpen: false,
    filterTitular: '',
    accounts: [],
    cards: [],
    transactions: [],
    fixedBills: [],
    categories: DEFAULT_CATEGORIES.slice(),
    titularColors: Object.assign({}, DEFAULT_COLORS),
    budgets: {},
    reportFilter: { mode:'month', month: currentMonthKey(), from:'', to:'', categoria:'', conta:'', cartao:'' },
    vencimentosSort: 'status',
    vencimentosMonth: 'todos',
    expandedCards: {},
    editing: { type:null, id:null, transferId:null },
    txDraft: null,
    billDraft: null,
    payingCycle: null,
    launchingBillId: null,
    confirmingDeleteKey: null,
    saveStatus: ''
  };
  state.txDraft = freshTxDraft();
  state.billDraft = freshBillDraft();

  var saveTimer = null;
  var charts = { pie:null, trend:null };

  function isConfigured(){ return CONFIG.API_URL && CONFIG.API_URL.indexOf('http') === 0; }

  // ---------- helpers ----------
  function uid(){ return 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function todayISO(){ var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
  function pad2(n){ return String(n).padStart(2,'0'); }
  function currentMonthKey(){ return todayISO().slice(0,7); }
  function fmtBRL(n){ return (Number(n)||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' }); }
  function fmtDate(d){ if(!d) return ''; var p = d.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
  function fmtDateObj(d){ return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear(); }
  function fmtDateShort(d){ return pad2(d.getDate())+'/'+pad2(d.getMonth()+1); }
  function esc(s){ return String(s===undefined||s===null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function monthLabel(mk){ var p = mk.split('-'); return MONTHS_PT[parseInt(p[1],10)-1] + ' de ' + p[0]; }
  function shiftMonth(mk, delta){ var p = mk.split('-').map(Number); var y=p[0], m=p[1]; m+=delta; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} return y+'-'+pad2(m); }
  function toLocalDate(s){ var p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
  function daysInMonth(y,m){ return new Date(y, m, 0).getDate(); }
  function clampInt(v,min,max){ v = parseInt(v,10); if(isNaN(v)) v = min; if(v<min) v=min; if(v>max) v=max; return v; }
  function ownerColor(titular){ return state.titularColors[titular] || 'var(--border)'; }

  // ---------- card billing cycle ----------
  function cardClosingDate(card, y, m){
    var day = Math.min(card.closingDay || 1, daysInMonth(y,m));
    var d = new Date(y, m-1, day);
    while(d.getDay()===0 || d.getDay()===6){ d.setDate(d.getDate()+1); }
    return d;
  }
  function invoiceCycleForDate(card, dateObj){
    var y = dateObj.getFullYear(), m = dateObj.getMonth()+1;
    var closing = cardClosingDate(card, y, m);
    if(dateObj.getTime() <= closing.getTime()) return { year:y, month:m };
    var nm=m+1, ny=y; if(nm>12){nm=1;ny++;}
    return { year:ny, month:nm };
  }
  function cycleKey(c){ return c.year + '-' + pad2(c.month); }
  function addMonthsToCycle(c,n){ var m=c.month+n,y=c.year; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return {year:y,month:m}; }
  function parseCycleKey(k){ var p=k.split('-').map(Number); return {year:p[0],month:p[1]}; }
  function invoiceDueDate(card, cycle){
    var dm=cycle.month, dy=cycle.year;
    if((card.dueDay||1) < (card.closingDay||1)){ dm++; if(dm>12){dm=1;dy++;} }
    var day = Math.min(card.dueDay||1, daysInMonth(dy,dm));
    return new Date(dy, dm-1, day);
  }
  function cycleOpenDate(card, cycle){
    var prev = addMonthsToCycle(cycle,-1);
    var closing = cardClosingDate(card, prev.year, prev.month);
    var d = new Date(closing); d.setDate(d.getDate()+1);
    return d;
  }
  function cardInvoiceTotal(card, ck){
    var total=0;
    for(var i=0;i<state.transactions.length;i++){ var t=state.transactions[i]; if(t.cardId===card.id && t.invoiceCycleKey===ck) total+=Number(t.value); }
    return total;
  }
  function cyclePaid(card, ck){ return (card.paymentsByCycle && card.paymentsByCycle[ck]) || 0; }
  function closedCycleKey(card){
    var now=new Date(); var y=now.getFullYear(), m=now.getMonth()+1;
    var closing = cardClosingDate(card,y,m);
    var todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if(todayMid.getTime() > closing.getTime()) return cycleKey({year:y,month:m});
    var pm=m-1,py=y; if(pm<1){pm=12;py--;}
    return cycleKey({year:py,month:pm});
  }
  function openCycleKey(card){ return cycleKey(invoiceCycleForDate(card, new Date())); }
  function pendingTotal(card){
    var total=0;
    for(var i=0;i<state.transactions.length;i++){
      var t=state.transactions[i];
      if(t.cardId===card.id){ total += Number(t.value); }
    }
    var paidTotal = 0;
    var pm = card.paymentsByCycle || {};
    Object.keys(pm).forEach(function(k){ paidTotal += pm[k]; });
    return total - paidTotal;
  }
  function nearbyCycles(card, centerDate, back, fwd){
    var base = invoiceCycleForDate(card, centerDate);
    var out = [];
    for(var i=-back;i<=fwd;i++) out.push(addMonthsToCycle(base,i));
    return out;
  }

  // ---------- balances ----------
  function accountBalance(acc){
    var bal = Number(acc.saldoInicial) || 0;
    for(var i=0;i<state.transactions.length;i++){
      var t = state.transactions[i];
      if(t.accountId === acc.id){ bal += (t.tipo === 'entrada' ? Number(t.value) : -Number(t.value)); }
    }
    return bal;
  }

  function computeStatus(dueDateObj, paidFraction){
    if(paidFraction >= 1) return { label:'Pago', cls:'paid', order:3 };
    var today = new Date(); today.setHours(0,0,0,0);
    var diffDays = Math.round((dueDateObj.getTime()-today.getTime())/86400000);
    if(diffDays < 0) return { label: paidFraction>0 ? 'Parcial - atrasada' : 'Atrasada', cls:'late', order:0 };
    if(diffDays <= 3) return { label: paidFraction>0 ? 'Parcial - vence em breve' : 'Vence em breve', cls:'soon', order:1 };
    return { label: paidFraction>0 ? 'Parcial - a vencer' : 'A vencer', cls:'upcoming', order:2 };
  }

  function activeFixedBills(){
    return state.fixedBills.filter(function(b){
      if(b.tipoRecorrencia === 'parcelada'){
        return (b.launchedMonths||[]).length < (b.totalParcelas||1);
      }
      return true;
    });
  }

  function fixedBillDueDate(bill){
    var now = new Date(); var y=now.getFullYear(), m=now.getMonth()+1;
    var day = Math.min(bill.dueDay||1, daysInMonth(y,m));
    return new Date(y, m-1, day);
  }

  function getReminders(){
    var mk = currentMonthKey();
    var map = {};
    activeFixedBills().forEach(function(b){
      var key = 'bill:'+b.id;
      if(map[key]) return;
      var due = fixedBillDueDate(b);
      var launched = (b.launchedMonths||[]).indexOf(mk) !== -1;
      var st = computeStatus(due, launched ? 1 : 0);
      map[key] = { title:b.name, sub:(b.natureza==='receita'?'Receita fixa':'Despesa fixa')+' - vence dia '+b.dueDay, value:b.value, status:st, dueDate:due, kind:'bill', id:b.id };
    });
    state.cards.forEach(function(c){
      var ck = closedCycleKey(c);
      var total = cardInvoiceTotal(c, ck);
      if(total > 0){
        var key = 'invoice:'+c.id+':'+ck;
        if(map[key]) return;
        var paid = cyclePaid(c, ck);
        var due = invoiceDueDate(c, parseCycleKey(ck));
        var st = computeStatus(due, paid/total);
        map[key] = { title:c.name+' - Fatura', sub:'Vence em '+fmtDateObj(due), value: total-paid, status:st, dueDate:due, kind:'invoice', id:c.id };
      }
    });
    return Object.keys(map).map(function(k){ return map[k]; });
  }

  function sortReminders(items, sortMode){
    var arr = items.slice();
    if(sortMode === 'valor'){ arr.sort(function(a,b){ return b.value - a.value; }); }
    else if(sortMode === 'data'){ arr.sort(function(a,b){ return a.dueDate.getTime()-b.dueDate.getTime(); }); }
    else{ arr.sort(function(a,b){ if(a.status.order!==b.status.order) return a.status.order-b.status.order; return a.dueDate.getTime()-b.dueDate.getTime(); }); }
    return arr;
  }
  function filterRemindersByMonth(items, monthMode){
    if(monthMode === 'todos') return items;
    var now = new Date();
    var targetMk = currentMonthKey();
    if(monthMode === 'anterior') targetMk = shiftMonth(targetMk, -1);
    if(monthMode === 'proximo') targetMk = shiftMonth(targetMk, 1);
    return items.filter(function(r){ return (r.dueDate.getFullYear()+'-'+pad2(r.dueDate.getMonth()+1)) === targetMk; });
  }

  // ---------- filters (report/transactions) ----------
  function matchesReportFilters(t){
    var f = state.reportFilter;
    if(f.categoria && t.category !== f.categoria) return false;
    if(f.conta && t.accountId !== f.conta) return false;
    if(f.cartao && t.cardId !== f.cartao) return false;
    return true;
  }
  function categoryTotalsInRange(fromDate, toDate){
    var map = {};
    for(var i=0;i<state.transactions.length;i++){
      var t = state.transactions[i];
      if(t.tipo !== 'saida' || t.isTransfer) continue;
      if(!matchesReportFilters(t)) continue;
      var d = toLocalDate(t.date);
      if(d.getTime()>=fromDate.getTime() && d.getTime()<=toDate.getTime()) map[t.category] = (map[t.category]||0)+Number(t.value);
    }
    var arr = Object.keys(map).map(function(k){ return [k, map[k]]; });
    arr.sort(function(a,b){ return b[1]-a[1]; });
    return arr;
  }
  function totalByTipoInRange(tipo, fromDate, toDate){
    var total = 0;
    for(var i=0;i<state.transactions.length;i++){
      var t = state.transactions[i];
      if(t.tipo !== tipo || t.isTransfer) continue;
      if(!matchesReportFilters(t)) continue;
      var d = toLocalDate(t.date);
      if(d.getTime()>=fromDate.getTime() && d.getTime()<=toDate.getTime()) total += Number(t.value);
    }
    return total;
  }
  function resolveReportRange(){
    var f = state.reportFilter; var today = new Date(); today.setHours(0,0,0,0);
    if(f.mode==='month'){ var p=f.month.split('-').map(Number); return { from:new Date(p[0],p[1]-1,1), to:new Date(p[0],p[1],0) }; }
    if(f.mode==='last3'){ var fm=shiftMonth(currentMonthKey(),-2).split('-').map(Number); return { from:new Date(fm[0],fm[1]-1,1), to:today }; }
    if(f.mode==='last6'){ var fm6=shiftMonth(currentMonthKey(),-5).split('-').map(Number); return { from:new Date(fm6[0],fm6[1]-1,1), to:today }; }
    if(f.mode==='year'){ return { from:new Date(today.getFullYear(),0,1), to:today }; }
    if(f.mode==='custom'){ return { from: f.from?toLocalDate(f.from):new Date(2000,0,1), to: f.to?toLocalDate(f.to):today }; }
    return { from:today, to:today };
  }
  function reportRangeLabel(){
    var f = state.reportFilter;
    if(f.mode==='month') return monthLabel(f.month);
    if(f.mode==='last3') return 'últimos 3 meses';
    if(f.mode==='last6') return 'últimos 6 meses';
    if(f.mode==='year') return 'ano de '+new Date().getFullYear();
    if(f.mode==='custom') return (f.from?fmtDate(f.from):'...')+' até '+(f.to?fmtDate(f.to):'...');
    return '';
  }
  function last6MonthsTrend(){
    var out = [];
    for(var i=5;i>=0;i--){
      var mk = shiftMonth(currentMonthKey(),-i);
      var p = mk.split('-').map(Number);
      var from = new Date(p[0],p[1]-1,1), to = new Date(p[0],p[1],0);
      out.push({ label: MONTHS_SHORT_PT[p[1]-1]+'/'+String(p[0]).slice(2), total: totalByTipoInRange('saida', from, to) });
    }
    return out;
  }

  function allTitulares(){
    var set = {};
    TITULARES_PADRAO.forEach(function(t){ set[t]=true; });
    state.accounts.forEach(function(a){ if(a.titular) set[a.titular]=true; });
    state.cards.forEach(function(c){ if(c.titular) set[c.titular]=true; });
    return Object.keys(set);
  }
  function passesOwnerFilter(titular){ return !state.filterTitular || titular === state.filterTitular; }

  // ---------- autocomplete ----------
  function findAutocompleteMatch(descValue){
    if(!descValue) return null;
    var needle = descValue.trim().toLowerCase();
    if(!needle) return null;
    var best = null;
    for(var i=state.transactions.length-1;i>=0;i--){
      var t = state.transactions[i];
      if(t.desc && t.desc.trim().toLowerCase() === needle){ best = t; break; }
    }
    return best;
  }

  // ---------- draft seeding ----------
  function seedTxDraft(t){
    if(!t) return freshTxDraft();
    var d = { value:t.value, date:t.date, desc:t.desc, category:t.category, forma:t.forma, tipo:t.tipo, accountId:t.accountId||'', cardId:t.cardId||'', origemId:'', destinoId:'', installments:'1', invoiceCycleOverride:t.invoiceCycleKey||'', applyToFollowing:false };
    if(t.isTransfer){
      d.forma = 'Transferência';
      var pair = state.transactions.filter(function(x){ return x.transferId===t.transferId; });
      var saidaLeg = pair.filter(function(x){return x.tipo==='saida';})[0] || t;
      var entradaLeg = pair.filter(function(x){return x.tipo==='entrada';})[0];
      d.origemId = saidaLeg.accountId||'';
      d.destinoId = entradaLeg ? (entradaLeg.accountId||'') : '';
      d.value = saidaLeg.value; d.date = saidaLeg.date; d.desc = saidaLeg.desc; d.category = saidaLeg.category;
    }
    return d;
  }
  function seedBillDraft(b){
    if(!b) return freshBillDraft();
    return { name:b.name, natureza:b.natureza, value:b.value, dueDay:b.dueDay, tipoRecorrencia:b.tipoRecorrencia, totalParcelas:b.totalParcelas||'12', forma:b.forma, cardId:b.cardId||'', accountId:b.accountId||'' };
  }

  // ---------- persistence ----------
  function setSaveStatus(msg){ state.saveStatus = msg; var el = document.getElementById('save-status'); if(el) el.textContent = msg; }
  var EPHEMERAL_KEYS = ['editing','confirmingDeleteKey','payingCycle','launchingBillId','txDraft','billDraft','navOpen','expandedCards'];

  function loadState(){
    if(!isConfigured()){
      document.getElementById('app').innerHTML = '<div class="setup-notice">Este painel ainda não está conectado a uma planilha.<br><br>'
        + 'Procure por <code>CONFIG.API_URL</code> perto do topo do script e cole ali a URL do seu Google Apps Script (termina em <code>/exec</code>).</div>';
      return;
    }
    fetch(CONFIG.API_URL).then(function(r){ return r.json(); }).then(function(saved){
      if(saved && typeof saved === 'object'){
        Object.keys(saved).forEach(function(k){
          if(EPHEMERAL_KEYS.indexOf(k) === -1) state[k] = saved[k];
        });
        if(!state.categories || !state.categories.length) state.categories = DEFAULT_CATEGORIES.slice();
        if(!state.titularColors) state.titularColors = Object.assign({}, DEFAULT_COLORS);
        if(!state.budgets) state.budgets = {};
        if(!state.reportFilter.categoria) state.reportFilter.categoria = '';
        if(!state.reportFilter.conta) state.reportFilter.conta = '';
        if(!state.reportFilter.cartao) state.reportFilter.cartao = '';
      }
      render();
    }).catch(function(err){
      document.getElementById('app').innerHTML = '<div class="setup-notice">Não foi possível carregar os dados agora.<br>'
        + 'Verifique a URL em <code>CONFIG.API_URL</code> e se a implantação está com acesso "Qualquer pessoa".<br><br>'
        + '<span style="font-size:11px;color:var(--text-faint)">'+esc(String(err))+'</span></div>';
    });
  }

  function persist(){
    clearTimeout(saveTimer);
    setSaveStatus('Salvando...');
    saveTimer = setTimeout(function(){
      if(!isConfigured()) return;
      var toSave = {
        tab: state.tab, filterTitular: state.filterTitular, accounts: state.accounts, cards: state.cards,
        transactions: state.transactions, fixedBills: state.fixedBills, categories: state.categories,
        titularColors: state.titularColors, budgets: state.budgets, reportFilter: state.reportFilter,
        vencimentosSort: state.vencimentosSort, vencimentosMonth: state.vencimentosMonth
      };
      fetch(CONFIG.API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(toSave) })
        .then(function(){ setSaveStatus('Salvo'); })
        .catch(function(err){ setSaveStatus('Erro ao salvar'); console.error(err); });
    }, 400);
  }
  function update(mutator){ mutator(); persist(); render(); }

            + '<div class="li-actions"><button type="button" class="icon-btn" data-action="edit-transaction" data-id="'+saidaLeg.id+'">Editar</button>'
            + '<button type="button" class="icon-btn '+(confirming?'confirm':'danger')+'" data-action="delete-transaction" data-id="'+saidaLeg.id+'">'+(confirming?'Confirmar':'Excluir')+'</button></div></div>';
        }

        var place='-';
        if(t.cardId){ var cc=state.cards.filter(function(c){return c.id===t.cardId;})[0]; place = cc?cc.name:'-'; }
        else if(t.accountId){ var ac=state.accounts.filter(function(a){return a.id===t.accountId;})[0]; place = ac?ac.name:'-'; }
        var parcelaTxt = t.installment ? (' <span class="tag">'+t.installment.current+'/'+t.installment.total+'</span>') : '';
        var billTag = t.billId ? ' <span class="tag">conta fixa</span>' : '';
        var sign = t.tipo==='entrada' ? '+' : '-';
        var groupBtn = t.installmentGroupId ? ('<button type="button" class="icon-btn '+(confirmingGroup?'confirm':'danger')+'" data-action="delete-transaction-group" data-id="'+t.id+'">'+(confirmingGroup?'Confirmar':'Excluir esta e as seguintes')+'</button>') : '';
        return '<div class="list-item"><div class="li-main"><div class="li-title">'+esc(t.desc)+parcelaTxt+billTag+'</div>'
          + '<div class="li-sub">'+fmtDate(t.date)+' - '+esc(t.category)+' - '+esc(t.forma)+' - '+esc(place)+'</div></div>'
          + '<div class="li-value '+t.tipo+'">'+sign+fmtBRL(t.value)+'</div>'
          + '<div class="li-actions"><button type="button" class="icon-btn" data-action="edit-transaction" data-id="'+t.id+'">Editar</button>'
          + '<button type="button" class="icon-btn '+(confirming?'confirm':'danger')+'" data-action="delete-transaction" data-id="'+t.id+'">'+(confirming?'Confirmar':'Excluir')+'</button>'
          + groupBtn + '</div></div>';
      }).join('') + '</div>';
    }
    return html;
  }

  function cycleSelectHTML(){
    var d = state.txDraft;
    var card = state.cards.filter(function(c){ return c.id===d.cardId; })[0] || state.cards[0];
    if(!card) return '';
    var refDate = toLocalDate(d.date || todayISO());
    var autoCycle = invoiceCycleForDate(card, refDate);
    var currentVal = d.invoiceCycleOverride || cycleKey(autoCycle);
    var options = nearbyCycles(card, refDate, 1, 3).map(function(c){
      var k = cycleKey(c);
      var due = invoiceDueDate(card, c);
      var label = fmtDateShort(due) + (k===cycleKey(autoCycle)?' (sugerida)':'');
      return '<option value="'+k+'" '+(k===currentVal?'selected':'')+'>'+label+'</option>';
    }).join('');
    return '<div><label>Fatura de destino</label><select name="invoiceCycleOverride">'+options+'</select></div>';
  }

  function refreshCycleOptions(form){
    if(!form) return;
    var select = form.querySelector('select[name="invoiceCycleOverride"]');
    var cardSel = form.querySelector('select[name="cardId"]');
    if(!select || !cardSel) return;
    var card = state.cards.filter(function(c){ return c.id===cardSel.value; })[0];
    if(!card) return;
    var dateInput = form.querySelector('input[name="date"]');
    var refDate = toLocalDate(dateInput && dateInput.value ? dateInput.value : todayISO());
    var autoCycle = invoiceCycleForDate(card, refDate);
    select.innerHTML = nearbyCycles(card, refDate, 1, 3).map(function(c){
      var k = cycleKey(c);
      var due = invoiceDueDate(card, c);
      var label = fmtDateShort(due) + (k===cycleKey(autoCycle)?' (sugerida)':'');
      return '<option value="'+k+'" '+(k===cycleKey(autoCycle)?'selected':'')+'>'+label+'</option>';
    }).join('');
    state.txDraft.invoiceCycleOverride = select.value;
  }

  function renderCards(){
    var editingC = state.editing.type==='card' ? state.cards.filter(function(c){return c.id===state.editing.id;})[0] : null;
    var titularOpts = allTitulares().map(function(t){return '<option value="'+esc(t)+'">';}).join('');

    html += '<form class="inline-form" data-form="card">'
      + '<input type="hidden" name="id" value="'+(editingC?editingC.id:'')+'">'
      + '<div class="form-row">'
      + '<div><label>Nome do cartão</label><input type="text" name="name" placeholder="Ex: Nubank, Inter" required value="'+(editingC?esc(editingC.name):'')+'"></div>'
      + '<div><label>Titular</label><input list="titular-list" name="titular" placeholder="Ex: Ana Julia" value="'+(editingC?esc(editingC.titular||''):'')+'"><datalist id="titular-list">'+titularOpts+'</datalist></div>'
      + '</div>'
      + '<div class="form-row">'
      + '<div><label>Dia de fechamento</label><input type="number" name="closingDay" min="1" max="31" required value="'+(editingC?editingC.closingDay:'')+'"></div>'

      + '<div><label>Limite total (R$)</label><input type="number" step="0.01" name="limit" value="'+(editingC?editingC.limit:'0')+'"></div>'
      + '</div>'
      + '<div class="settings-note">Se o dia de fechamento cair em sábado ou domingo, o app empurra automaticamente para o próximo dia útil (não considera feriados).</div>'
      + '<div class="form-actions">'+(editingC?'<button type="button" class="btn btn-ghost" data-action="cancel-edit">Cancelar</button>':'')+'<button type="submit" class="btn btn-primary">'+(editingC?'Salvar alterações':'Adicionar cartão')+'</button></div></form>';

    html += '<div class="section-title">Seus cartões</div>';
    var crds = state.cards.filter(function(c){ return passesOwnerFilter(c.titular); });
    if(crds.length===0){
      html += '<div class="empty">Nenhum cartão '+(state.filterTitular?'de '+esc(state.filterTitular)+' ':'')+'cadastrado ainda.</div>';
    }else{
      html += crds.map(function(c){
        var delKey = 'card:'+c.id;
        var confirming = state.confirmingDeleteKey === delKey;
        var expanded = !!state.expandedCards[c.id];
        var limiteDisp = (c.limit || 0) - pendingTotal(c);

        var block = '<div class="card">'
          + '<div class="card-head" data-action="toggle-card-expand" data-id="'+c.id+'">'
          + '<div><div class="li-title"><span class="owner-dot" style="background:'+ownerColor(c.titular)+'"></span> '+esc(c.name)+(c.titular?' ('+esc(c.titular)+')':'')+'</div>'
          + '<div class="li-sub">Fecha dia '+(c.closingDay||'-')+' - Vence dia '+(c.dueDay||'-')+' - Limite disp.: '+fmtBRL(limiteDisp)+'</div></div>'
          + '<button type="button" class="expand-btn" data-action="toggle-card-expand" data-id="'+c.id+'">'+(expanded?'&#9650;':'&#9660;')+'</button>'
          + '</div>';

        if(expanded){
          block += '<div class="li-actions" style="margin-top:10px;"><button type="button" class="icon-btn" data-action="edit-card" data-id="'+c.id+'">Editar</button>'
            + '<button type="button" class="icon-btn '+(confirming?'confirm':'danger')+'" data-action="delete-card" data-id="'+c.id+'">'+(confirming?'Confirmar':'Excluir')+'</button></div>';

          var cycles = nearbyCycles(c, new Date(), 1, 2);
          block += '<div class="section-title" style="font-size:13px;margin:16px 0 8px;">Próximas faturas</div>';
          block += '<div class="list">' + cycles.map(function(cyc){
            var ck = cycleKey(cyc);
            var total = cardInvoiceTotal(c, ck);
            var paid = cyclePaid(c, ck);
            var restante = total - paid;
            var due = invoiceDueDate(c, cyc);
            var isFuture = ck > openCycleKey(c);
            var label = ck === openCycleKey(c) ? 'Em aberto (parcial)' : (ck < openCycleKey(c) ? 'Fechada' : 'Futura (só parcelas já lançadas)');
            var badge = restante <= 0 && total > 0 ? '<span class="badge paid">Paga</span>' : (ck < openCycleKey(c) && total > 0 ? '<span class="badge '+computeStatus(due, paid/(total||1)).cls+'">'+computeStatus(due, paid/(total||1)).label+'</span>' : '');
            var row = '<div class="list-item"><div class="li-main"><div class="li-title">'+label+' - '+monthLabel(ck)+'</div><div class="li-sub">Vence em '+fmtDateObj(due)+(paid>0?' - já pago: '+fmtBRL(paid):'')+'</div></div>'
              + badge + '<div class="li-value">'+fmtBRL(Math.max(0,restante))+'</div></div>';
            if(restante > 0 && !isFuture){
              var accOpts = state.accounts.map(function(a){return '<option value="'+a.id+'">'+esc(a.name)+(a.titular?' ('+esc(a.titular)+')':'')+'</option>';}).join('');
              var isPaying = state.payingCycle === (c.id+':'+ck);
              if(isPaying){
                row += '<form class="inline-form" data-form="pay-invoice" data-card-id="'+c.id+'" data-cycle="'+ck+'" style="margin-top:0;">'
                  + '<div class="form-row"><div><label>Conta</label><select name="accountId" required>'+(state.accounts.length?accOpts:'<option value="">Cadastre uma conta primeiro</option>')+'</select></div>'
                  + '<div><label>Valor a pagar (R$)</label><input type="number" step="0.01" min="0.01" max="'+restante.toFixed(2)+'" name="amount" value="'+restante.toFixed(2)+'" required></div></div>'
                  + '<div class="form-actions"><button type="button" class="btn btn-ghost btn-small" data-action="cancel-pay">Cancelar</button><button type="submit" class="btn btn-primary btn-small">Confirmar pagamento</button></div></form>';
              }else{
                row += '<div class="form-actions" style="margin-top:-4px;"><button type="button" class="btn btn-ghost btn-small" data-action="start-pay" data-card-id="'+c.id+'" data-cycle="'+ck+'">Pagar</button></div>';
              }
            }
            return row;
          }).join('') + '</div>';
        }
        block += '</div>';
        return block;
      }).join('');
    }
    return html;
  }

    var formaSel = d.forma;

    var html = '<div class="section-title">'+(isEditing?'Editar conta fixa':'Nova conta fixa')+'</div>';

      + '<div><label>Nome</label><input type="text" name="name" placeholder="Ex: Aluguel, Financiamento do carro" required value="'+esc(d.name)+'"></div>'

      + '</div>'

      + '<div><label>Dia do vencimento</label><input type="number" min="1" max="31" name="dueDay" required value="'+esc(d.dueDay)+'"></div>'
      + '<div><label>Forma</label><select name="forma" data-action="bill-forma-change">'+FORMA_FIXA.map(function(f){return '<option value="'+f.v+'" '+(formaSel===f.v?'selected':'')+'>'+f.l+'</option>';}).join('')+'</select></div>'
      + '</div>'
      + '<div class="form-row">'
      + (formaSel==='cartao'
          ? '<div><label>Cartão</label><select name="cardId">'+(state.cards.length?state.cards.map(function(c){return '<option value="'+c.id+'" '+(d.cardId===c.id?'selected':'')+'>'+esc(c.name)+'</option>';}).join(''):'<option value="">Cadastre um cartão primeiro</option>')+'</select></div>'
          : '<div><label>Conta padrão</label><select name="accountId">'+ (state.accounts.length?('<option value="">Escolher na hora de lançar</option>'+state.accounts.map(function(a){return '<option value="'+a.id+'" '+(d.accountId===a.id?'selected':'')+'>'+esc(a.name)+'</option>';}).join('')):'<option value="">Cadastre uma conta primeiro</option>')+'</select></div>')
      + '</div>'
      + '<div class="form-actions">'+(isEditing?'<button type="button" class="btn btn-ghost" data-action="cancel-edit">Cancelar</button>':'')+'<button type="submit" class="btn btn-primary">'+(isEditing?'Salvar alterações':'Adicionar conta fixa')+'</button></div></form>';

    html += '<div class="section-title">Contas fixas ativas</div>';
    var active = activeFixedBills();
    if(active.length===0){
      html += '<div class="empty">Nenhuma conta fixa cadastrada ainda.</div>';
    }else{
      var mk = currentMonthKey();
      var sorted = active.slice().sort(function(a,b){
        var sa = computeStatus(fixedBillDueDate(a), (a.launchedMonths||[]).indexOf(mk)!==-1?1:0);
        var sb = computeStatus(fixedBillDueDate(b), (b.launchedMonths||[]).indexOf(mk)!==-1?1:0);
        if(sa.order!==sb.order) return sa.order-sb.order;
        return a.dueDay-b.dueDay;
      });
      html += '<div class="list">' + sorted.map(function(b){
        var launched = (b.launchedMonths||[]).indexOf(mk) !== -1;
        var st = computeStatus(fixedBillDueDate(b), launched?1:0);
        var delKey = 'bill:'+b.id;
        var confirming = state.confirmingDeleteKey === delKey;
        var parcelaInfo = b.tipoRecorrencia==='parcelada' ? ' <span class="tag">'+((b.launchedMonths||[]).length)+'/'+b.totalParcelas+'</span>' : '';
        var formaLabel = FORMA_FIXA.filter(function(f){return f.v===b.forma;})[0];
        var isLaunching = state.launchingBillId === b.id;

        var row = '<div class="list-item"><div class="li-main"><div class="li-title">'+esc(b.name)+parcelaInfo+(b.natureza==='receita'?' <span class="tag">receita</span>':'')+'</div>'
          + '<div class="li-sub">Vence dia '+b.dueDay+' - '+(formaLabel?formaLabel.l:'')+'</div></div>'
          + '<span class="badge '+st.cls+'">'+st.label+'</span><div class="li-value '+(b.natureza==='receita'?'entrada':'saida')+'">'+fmtBRL(b.value)+'</div>'
          + '<div class="li-actions">'
          + (launched ? '' : '<button type="button" class="btn btn-primary btn-small" data-action="start-launch" data-id="'+b.id+'">Lançar</button>')
          + '<button type="button" class="icon-btn" data-action="edit-bill" data-id="'+b.id+'">Editar</button>'
          + '<button type="button" class="icon-btn '+(confirming?'confirm':'danger')+'" data-action="delete-bill" data-id="'+b.id+'">'+(confirming?'Confirmar':'Excluir')+'</button></div></div>';

        if(isLaunching){
          var accOptsL = state.accounts.map(function(a){return '<option value="'+a.id+'" '+(b.accountId===a.id?'selected':'')+'>'+esc(a.name)+'</option>';}).join('');
          row += '<form class="inline-form" data-form="launch-bill" data-bill-id="'+b.id+'" style="margin-top:-2px;">'
            + '<div class="form-row">'
            + '<div><label>Data</label><input type="date" name="date" value="'+todayISO()+'" required></div>'
            + '<div><label>Valor real (R$)</label><input type="number" step="0.01" min="0.01" name="value" value="'+b.value+'" required></div>'
            + (b.forma==='cartao' ? '' : '<div><label>Conta</label><select name="accountId" required>'+(state.accounts.length?accOptsL:'<option value="">Cadastre uma conta primeiro</option>')+'</select></div>')
            + '</div>'
            + '<div class="form-actions"><button type="button" class="btn btn-ghost btn-small" data-action="cancel-launch">Cancelar</button><button type="submit" class="btn btn-primary btn-small">Confirmar</button></div></form>';
        }
        return row;
      }).join('') + '</div>';
    }
    return html;
  }

  // ---------- report ----------
  function renderReport(){
    var f = state.reportFilter;
    var range = resolveReportRange();
    var totals = categoryTotalsInRange(range.from, range.to);
    var totalPeriodo = totals.reduce(function(s,c){return s+c[1];}, 0);
    var totalDoado = totalByTipoInRange('presente', range.from, range.to);
    var totalInvestido = totalByTipoInRange('investimento', range.from, range.to);
    var totalEntradaAvulsa = totalByTipoInRange('entrada', range.from, range.to);

    var receitaFixaPrevista = 0, gastoFixoPrevisto = 0;
    activeFixedBills().forEach(function(b){
      if(b.natureza==='receita') receitaFixaPrevista += Number(b.value)||0;
      else gastoFixoPrevisto += Number(b.value)||0;
    });
    var sobraPrevista = receitaFixaPrevista + totalEntradaAvulsa - gastoFixoPrevisto - totalPeriodo;

    var modeSelect = '<select data-action="report-mode-change">'
      + '<option value="month" '+(f.mode==='month'?'selected':'')+'>Mês específico</option>'
      + '<option value="last3" '+(f.mode==='last3'?'selected':'')+'>Últimos 3 meses</option>'
      + '<option value="last6" '+(f.mode==='last6'?'selected':'')+'>Últimos 6 meses</option>'
      + '<option value="year" '+(f.mode==='year'?'selected':'')+'>Este ano</option>'
      + '<option value="custom" '+(f.mode==='custom'?'selected':'')+'>Personalizado</option></select>';

    var html = '<div class="form-row" style="margin-bottom:12px;"><div><label>Período</label>'+modeSelect+'</div>';
    if(f.mode==='month'){
      html += '<div><label>&nbsp;</label><div class="month-picker"><button type="button" data-action="report-prev">&lt;</button><span class="label">'+monthLabel(f.month)+'</span><button type="button" data-action="report-next">&gt;</button></div></div>';
    }else if(f.mode==='custom'){
      html += '<div><label>De</label><input type="date" data-action="report-from-change" value="'+esc(f.from)+'"></div><div><label>Até</label><input type="date" data-action="report-to-change" value="'+esc(f.to)+'"></div>';
    }
    html += '</div>';

    html += '<div class="form-row" style="margin-bottom:14px;">'
      + '<div><label>Categoria</label><select data-action="report-filter-categoria"><option value="">Todas</option>'+optionsHTML(state.categories, f.categoria)+'</select></div>'
      + '<div><label>Conta</label><select data-action="report-filter-conta"><option value="">Todas</option>'+state.accounts.map(function(a){return '<option value="'+a.id+'" '+(f.conta===a.id?'selected':'')+'>'+esc(a.name)+'</option>';}).join('')+'</select></div>'
      + '<div><label>Cartão</label><select data-action="report-filter-cartao"><option value="">Todos</option>'+state.cards.map(function(c){return '<option value="'+c.id+'" '+(f.cartao===c.id?'selected':'')+'>'+esc(c.name)+'</option>';}).join('')+'</select></div>'
      + '</div>';

    html += '<div class="section-title">Resumo fixo x variável (mês atual, com base no cadastro)</div>';
    html += '<div class="summary-grid">'
      + '<div class="mini-card"><div class="name">Receita fixa prevista</div><div class="val" style="color:var(--green)">'+fmtBRL(receitaFixaPrevista)+'</div></div>'
      + '<div class="mini-card"><div class="name">Gasto fixo previsto</div><div class="val" style="color:var(--red)">'+fmtBRL(gastoFixoPrevisto)+'</div></div>'
      + '<div class="mini-card"><div class="name">Renda extra (período)</div><div class="val" style="color:var(--green)">'+fmtBRL(totalEntradaAvulsa)+'</div></div>'
      + '<div class="mini-card"><div class="name">Sobra prevista</div><div class="val '+(sobraPrevista<0?'neg':'')+'">'+fmtBRL(sobraPrevista)+'</div></div>'
      + '</div>';

    html += '<div id="report-capture" class="export-surface">';
    html += '<div class="card"><div class="hero-label">Total de gastos - '+reportRangeLabel()+'</div><div class="hero-value" style="font-size:24px;">'+fmtBRL(totalPeriodo)+'</div></div>';

      html += '<div class="summary-grid">'
        + (totalDoado>0 ? '<div class="mini-card"><div class="name">Total doado / presentes</div><div class="val" style="color:var(--accent2)">'+fmtBRL(totalDoado)+'</div></div>' : '')
        + (totalInvestido>0 ? '<div class="mini-card"><div class="name">Total investido</div><div class="val" style="color:var(--accent2)">'+fmtBRL(totalInvestido)+'</div></div>' : '')
        + '</div>';

    html += '<div class="grid-2">'
      + '<div class="chart-wrap"><div class="section-title" style="margin-top:0;">Por categoria</div><canvas id="chart-pie"></canvas></div>'
      + '<div class="chart-wrap"><div class="section-title" style="margin-top:0;">Evolução - últimos 6 meses</div><canvas id="chart-trend"></canvas></div>'
      + '</div>';

    html += '<div class="section-title">Detalhamento e orçamento</div>';
    if(totals.length===0){
      html += '<div class="empty">Nenhum gasto lançado neste período com esses filtros.</div>';
    }else{
      html += '<div>' + totals.map(function(c){
        var pct = totalPeriodo>0 ? (c[1]/totalPeriodo*100) : 0;
        var budget = state.budgets[c[0]];
        var budgetLine = '';
        if(budget){
          var bpct = Math.min(100, (c[1]/budget)*100);
          var over = c[1] > budget;
          budgetLine = '<div class="bar-track" style="margin-top:4px;"><div class="bar-fill '+(over?'over':'')+'" style="width:'+bpct+'%"></div></div>'
            + '<div style="font-size:11px;color:'+(over?'var(--red)':'var(--text-faint)')+';margin-top:2px;">Orçamento: '+fmtBRL(budget)+(over?' - estourou em '+fmtBRL(c[1]-budget):'')+'</div>';
        }
        return '<div class="report-row"><div class="report-head"><span class="report-cat">'+esc(c[0])+'</span><span class="report-val">'+fmtBRL(c[1])+' - '+pct.toFixed(0)+'%</span></div>'
          + '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div>'+budgetLine+'</div>';
      }).join('') + '</div>';
    }
    html += '</div>';

    html += '<div class="form-actions" style="margin-top:14px;"><button type="button" class="btn btn-ghost" data-action="export-image">Exportar imagem (PNG)</button><button type="button" class="btn btn-ghost" data-action="export-pdf">Exportar PDF</button></div><div class="export-status" id="export-status"></div>';
    return html;
  }

  function drawCharts(){
    if(state.tab !== 'report') return;
    if(typeof Chart === 'undefined') return;
    var range = resolveReportRange();
    var totals = categoryTotalsInRange(range.from, range.to);
    var pieEl = document.getElementById('chart-pie');
    if(pieEl){
      if(charts.pie){ charts.pie.destroy(); charts.pie = null; }
      var palette = ['#6EE7C7','#60A5FA','#FBBF24','#FB7676','#A78BFA','#34D399','#F472B6','#38BDF8','#FDBA74','#94A3B8','#F87171','#4ADE80'];
      charts.pie = new Chart(pieEl.getContext('2d'), { type:'doughnut', data:{ labels:totals.map(function(c){return c[0];}), datasets:[{ data:totals.map(function(c){return c[1];}), backgroundColor:palette, borderWidth:0 }] }, options:{ plugins:{ legend:{ position:'bottom', labels:{ color:'#8A93A6', boxWidth:10, font:{size:11} } } } } });
    }
    var trendEl = document.getElementById('chart-trend');
    if(trendEl){
      if(charts.trend){ charts.trend.destroy(); charts.trend = null; }
      var trend = last6MonthsTrend();
      charts.trend = new Chart(trendEl.getContext('2d'), { type:'bar', data:{ labels:trend.map(function(t){return t.label;}), datasets:[{ data:trend.map(function(t){return t.total;}), backgroundColor:'#6EE7C7', borderRadius:4 }] }, options:{ plugins:{ legend:{ display:false } }, scales:{ x:{ ticks:{ color:'#8A93A6' }, grid:{ display:false } }, y:{ ticks:{ color:'#8A93A6' }, grid:{ color:'#24304A' } } } } });
    }
  }

  var sectionRenderers = { overview:renderOverview, vencimentos:renderVencimentos, transactions:renderTransactions, accounts:renderAccounts, cards:renderCards, bills:renderBills, report:renderReport, settings:renderSettings };

  function setExportStatus(msg){ var el = document.getElementById('export-status'); if(el) el.textContent = msg; }
  function exportImage(){
    var el = document.getElementById('report-capture'); if(!el) return;
    if(typeof html2canvas==='undefined'){ setExportStatus('Recurso ainda carregando, tente de novo em instantes.'); return; }
    setExportStatus('Gerando imagem...');
    html2canvas(el,{backgroundColor:'#0B1220'}).then(function(canvas){
      var link=document.createElement('a'); link.download='relatorio-financas.png'; link.href=canvas.toDataURL('image/png'); link.click();
      setExportStatus('Imagem exportada.');
    }).catch(function(){ setExportStatus('Erro ao exportar imagem.'); });
  }
  function exportPDF(){
    var el = document.getElementById('report-capture'); if(!el) return;
    if(typeof html2canvas==='undefined' || typeof window.jspdf==='undefined'){ setExportStatus('Recurso ainda carregando, tente de novo em instantes.'); return; }
    setExportStatus('Gerando PDF...');
    html2canvas(el,{backgroundColor:'#0B1220'}).then(function(canvas){
      var jsPDF = window.jspdf.jsPDF;
      var pdf = new jsPDF({ orientation:'portrait', unit:'pt', format:'a4' });
      var pageWidth = pdf.internal.pageSize.getWidth();
      var imgW = pageWidth-40, imgH = canvas.height*(imgW/canvas.width);
      pdf.addImage(canvas.toDataURL('image/png'),'PNG',20,20,imgW,imgH);
      pdf.save('relatorio-financas.pdf');
      setExportStatus('PDF exportado.');
    }).catch(function(){ setExportStatus('Erro ao exportar PDF.'); });
  }

  // ---------- event delegation ----------
  document.addEventListener('click', function(e){
    var btn = e.target.closest('[data-action]');
    if(!btn) return;
    var action = btn.dataset.action;
    var isDeleteAction = action.indexOf('delete-') === 0 || action === 'reset-all';

    if(action==='toggle-nav'){ state.navOpen = !state.navOpen; render(); return; }
    if(action==='close-nav'){ state.navOpen = false; render(); return; }
    if(action==='go-tab'){
      state.tab=btn.dataset.tab; state.navOpen=false; state.editing={type:null,id:null,transferId:null};
      state.confirmingDeleteKey=null; state.txDraft=freshTxDraft(); state.billDraft=freshBillDraft();
      state.payingCycle=null; state.launchingBillId=null; render(); return;
    }
    if(action==='cancel-edit'){ state.editing={type:null,id:null,transferId:null}; state.txDraft=freshTxDraft(); state.billDraft=freshBillDraft(); render(); return; }
    if(action==='toggle-card-expand'){ var cid=btn.dataset.id; state.expandedCards[cid]=!state.expandedCards[cid]; render(); return; }
    if(action.indexOf('edit-')===0 && action!=='edit'){
      var type = action.replace('edit-','');
      if(type==='transaction'){
        var t = state.transactions.filter(function(x){return x.id===btn.dataset.id;})[0];
        state.txDraft = seedTxDraft(t);
        state.editing = { type:'transaction', id: t.id, transferId: t.transferId||null };
      }else if(type==='bill'){
        var b = state.fixedBills.filter(function(x){return x.id===btn.dataset.id;})[0];
        state.billDraft = seedBillDraft(b);
        state.editing = { type:'bill', id: b.id, transferId:null };
      }else{
        state.editing = { type:type, id: btn.dataset.id, transferId:null };
      }
      state.confirmingDeleteKey=null;
      render(); window.scrollTo({top:0,behavior:'smooth'});
      return;
    }
    if(action==='start-pay'){ state.payingCycle = btn.dataset.cardId+':'+btn.dataset.cycle; render(); return; }
    if(action==='cancel-pay'){ state.payingCycle = null; render(); return; }
    if(action==='start-launch'){ state.launchingBillId = btn.dataset.id; render(); return; }
    if(action==='cancel-launch'){ state.launchingBillId = null; render(); return; }
    if(action==='refresh-now'){ loadState(); return; }
    if(action==='report-prev'){ state.reportFilter.month = shiftMonth(state.reportFilter.month,-1); render(); return; }
    if(action==='report-next'){ state.reportFilter.month = shiftMonth(state.reportFilter.month, 1); render(); return; }
    if(action==='export-image'){ exportImage(); return; }
    if(action==='export-pdf'){ exportPDF(); return; }

    if(action==='delete-transaction-group'){
      var key = 'transaction-group:'+btn.dataset.id;
      if(state.confirmingDeleteKey === key){
        var target = state.transactions.filter(function(x){return x.id===btn.dataset.id;})[0];
        if(target && target.installmentGroupId){
          var gid = target.installmentGroupId, fromN = target.installment.current;
          update(function(){
            state.transactions = state.transactions.filter(function(x){
              return !(x.installmentGroupId===gid && x.installment && x.installment.current >= fromN);
            });
            state.confirmingDeleteKey = null;
          });
        }
      }else{
        state.confirmingDeleteKey = key; render();
        setTimeout(function(){ if(state.confirmingDeleteKey===key){ state.confirmingDeleteKey=null; render(); } }, 3500);
      }
      return;
    }

    if(isDeleteAction){
      var key2 = action==='reset-all' ? 'reset-all' : (action.replace('delete-','') + ':' + btn.dataset.id);
      if(state.confirmingDeleteKey === key2){
        if(action==='reset-all'){
          update(function(){ state.accounts=[]; state.cards=[]; state.transactions=[]; state.fixedBills=[]; state.confirmingDeleteKey=null; });
        }else if(action==='delete-category'){
          update(function(){ state.categories = state.categories.filter(function(c){return c!==btn.dataset.id;}); delete state.budgets[btn.dataset.id]; state.confirmingDeleteKey=null; });
        }else if(action==='delete-transaction'){
          var delId = btn.dataset.id;
          update(function(){
            var tgt = state.transactions.filter(function(x){return x.id===delId;})[0];
            if(tgt && tgt.isTransfer && tgt.transferId){
              state.transactions = state.transactions.filter(function(x){return x.transferId!==tgt.transferId;});
            }else{
              state.transactions = state.transactions.filter(function(x){return x.id!==delId;});
            }
            state.confirmingDeleteKey = null;
          });
        }else{
          var parts = key2.split(':'); var tt=parts[0], id=parts[1];
          update(function(){
            if(tt==='account') state.accounts = state.accounts.filter(function(x){return x.id!==id;});
            if(tt==='card') state.cards = state.cards.filter(function(x){return x.id!==id;});
            if(tt==='bill') state.fixedBills = state.fixedBills.filter(function(x){return x.id!==id;});
            state.confirmingDeleteKey = null;
          });
        }
      }else{
        state.confirmingDeleteKey = key2; render();
        setTimeout(function(){ if(state.confirmingDeleteKey===key2){ state.confirmingDeleteKey=null; render(); } }, 3500);
      }
      return;
    }
  });

  document.addEventListener('input', function(e){
    var t = e.target;
    if(!t.name) return;
    var txForm = t.closest('form[data-form="transaction"]');
    if(txForm){ state.txDraft[t.name] = t.value; if(t.name==='date'){ refreshCycleOptions(txForm); } return; }
    var billForm = t.closest('form[data-form="bill"]');
    if(billForm){ state.billDraft[t.name] = t.value; return; }
  });

  document.addEventListener('change', function(e){
    var t = e.target;
    if(t.name){
      var txForm = t.closest('form[data-form="transaction"]');
      if(txForm){ state.txDraft[t.name] = (t.type==='checkbox' ? t.checked : t.value); }
      var billForm = t.closest('form[data-form="bill"]');
      if(billForm){ state.billDraft[t.name] = t.value; }
    }
    if(!t.dataset) return;
    if(t.dataset.action === 'forma-change'){ render(); }
    else if(t.dataset.action === 'card-select-change'){ refreshCycleOptions(t.closest('form')); }
    else if(t.dataset.action === 'owner-filter-change'){ state.filterTitular = t.value; render(); }
    else if(t.dataset.action === 'bill-tipo-change'){ render(); }
    else if(t.dataset.action === 'bill-forma-change'){ render(); }
    else if(t.dataset.action === 'vencimentos-sort-change'){ state.vencimentosSort = t.value; persist(); render(); }
    else if(t.dataset.action === 'vencimentos-month-change'){ state.vencimentosMonth = t.value; persist(); render(); }
    else if(t.dataset.action === 'report-mode-change'){ state.reportFilter.mode = t.value; render(); }
    else if(t.dataset.action === 'report-from-change'){ state.reportFilter.from = t.value; render(); }
    else if(t.dataset.action === 'report-to-change'){ state.reportFilter.to = t.value; render(); }
    else if(t.dataset.action === 'report-filter-categoria'){ state.reportFilter.categoria = t.value; persist(); render(); }
    else if(t.dataset.action === 'report-filter-conta'){ state.reportFilter.conta = t.value; persist(); render(); }
    else if(t.dataset.action === 'report-filter-cartao'){ state.reportFilter.cartao = t.value; persist(); render(); }
    else if(t.dataset.action === 'tx-filter-categoria'){ state.reportFilter.categoria = t.value; persist(); render(); }
    else if(t.dataset.action === 'tx-filter-conta'){ state.reportFilter.conta = t.value; persist(); render(); }
    else if(t.dataset.action === 'tx-filter-cartao'){ state.reportFilter.cartao = t.value; persist(); render(); }
    else if(t.dataset.action === 'titular-color-change'){ update(function(){ state.titularColors[t.dataset.titular] = t.value; }); }
  });

  document.addEventListener('submit', function(e){
    var form = e.target.closest('form[data-form]');
    if(!form) return;
    e.preventDefault();
    var type = form.dataset.form;
    var fd = new FormData(form);
    var id = fd.get('id');

    if(type === 'account'){
      var name=(fd.get('name')||'').trim(), titular=(fd.get('titular')||'').trim();
      var saldoInicial = parseFloat(fd.get('saldoInicial'))||0;
      var isInvestment = fd.get('isInvestment')==='on';
      if(!name) return;
      update(function(){
        if(id){ var acc=state.accounts.filter(function(a){return a.id===id;})[0]; acc.name=name; acc.titular=titular; acc.saldoInicial=saldoInicial; acc.isInvestment=isInvestment; }
        else{ state.accounts.push({ id:uid(), name:name, titular:titular, saldoInicial:saldoInicial, isInvestment:isInvestment }); if(titular && !state.titularColors[titular]) state.titularColors[titular]=DEFAULT_COLORS[titular]||'#60A5FA'; }
        state.editing={type:null,id:null,transferId:null};
      });
    }

    if(type === 'card'){
      var cname=(fd.get('name')||'').trim(), ctitular=(fd.get('titular')||'').trim();
      var closingDay=clampInt(fd.get('closingDay'),1,31), dueDay=clampInt(fd.get('dueDay'),1,31);
      var limit=parseFloat(fd.get('limit'))||0;
      if(!cname) return;
      update(function(){
        if(id){ var c=state.cards.filter(function(x){return x.id===id;})[0]; c.name=cname; c.titular=ctitular; c.closingDay=closingDay; c.dueDay=dueDay; c.limit=limit; }
        else{ state.cards.push({ id:uid(), name:cname, titular:ctitular, closingDay:closingDay, dueDay:dueDay, limit:limit, paymentsByCycle:{} }); if(ctitular && !state.titularColors[ctitular]) state.titularColors[ctitular]=DEFAULT_COLORS[ctitular]||'#F472B6'; }
        state.editing={type:null,id:null,transferId:null};
      });
    }

    if(type === 'bill'){
      var bname=(fd.get('name')||'').trim();
      var natureza = fd.get('natureza');
      var bvalue = parseFloat(fd.get('value'));
      var bDueDay = clampInt(fd.get('dueDay'),1,31);
      var tipoRecorrencia = fd.get('tipoRecorrencia');
      var totalParcelas = tipoRecorrencia==='parcelada' ? clampInt(fd.get('totalParcelas'),2,360) : null;
      var forma = fd.get('forma');
      var cardId = forma==='cartao' ? fd.get('cardId') : null;
      var accountId = forma!=='cartao' ? (fd.get('accountId')||null) : null;
      if(!bname || !bvalue) return;
      update(function(){
        if(id){
          var b = state.fixedBills.filter(function(x){return x.id===id;})[0];
          b.name=bname; b.natureza=natureza; b.value=bvalue; b.dueDay=bDueDay; b.tipoRecorrencia=tipoRecorrencia; b.totalParcelas=totalParcelas; b.forma=forma; b.cardId=cardId; b.accountId=accountId;
        }else{
          state.fixedBills.push({ id:uid(), name:bname, natureza:natureza, value:bvalue, dueDay:bDueDay, tipoRecorrencia:tipoRecorrencia, totalParcelas:totalParcelas, forma:forma, cardId:cardId, accountId:accountId, launchedMonths:[] });
        }
        state.editing={type:null,id:null,transferId:null}; state.billDraft=freshBillDraft();
      });
    }

    if(type === 'pay-invoice'){
      var cardId2 = form.dataset.cardId, ck = form.dataset.cycle;
      var card = state.cards.filter(function(c){return c.id===cardId2;})[0];
      var accountId2 = fd.get('accountId');
      var amount = parseFloat(fd.get('amount'));
      if(!card || !accountId2 || !amount) return;
      update(function(){
        state.transactions.push({ id:uid(), value:amount, date:todayISO(), desc:card.name+' - Pagamento de fatura ('+monthLabel(ck)+')', category:'Fatura de cartão', forma:PAGAMENTO_FATURA_FORMA, tipo:'saida', accountId:accountId2, cardId:null, invoiceCycleKey:null, installment:null });
        card.paymentsByCycle = card.paymentsByCycle || {};
        card.paymentsByCycle[ck] = (card.paymentsByCycle[ck]||0) + amount;
        state.payingCycle = null;
      });
    }

    if(type === 'launch-bill'){
      var billId = form.dataset.billId;
      var bill = state.fixedBills.filter(function(b){return b.id===billId;})[0];
      var ldate = fd.get('date') || todayISO();
      var lvalue = parseFloat(fd.get('value'));
      var laccountId = fd.get('accountId');
      if(!bill || !lvalue) return;
      var mk = ldate.slice(0,7);
      update(function(){
        var tipo = bill.natureza==='receita' ? 'entrada' : 'saida';
        var tx = { id:uid(), value:lvalue, date:ldate, desc:bill.name, category: bill.natureza==='receita'?'Receita fixa':'Contas fixas', forma: bill.forma==='cartao'?'Cartão de Crédito':(bill.forma==='boleto'?'Boleto':'Débito automático'), tipo:tipo, accountId:null, cardId:null, invoiceCycleKey:null, installment:null, billId:bill.id };
        if(bill.forma === 'cartao' && bill.cardId){
          var cardObj = state.cards.filter(function(c){return c.id===bill.cardId;})[0];
          if(cardObj){ tx.cardId = bill.cardId; tx.invoiceCycleKey = cycleKey(invoiceCycleForDate(cardObj, toLocalDate(ldate))); }
        }else{
          tx.accountId = laccountId || bill.accountId;
        }
        state.transactions.push(tx);
        bill.launchedMonths = bill.launchedMonths || [];
        if(bill.launchedMonths.indexOf(mk) === -1) bill.launchedMonths.push(mk);
        state.launchingBillId = null;
      });
    }

    if(type === 'add-category'){
      var catName = (fd.get('name')||'').trim();
      if(!catName) return;
      update(function(){ if(state.categories.indexOf(catName)===-1) state.categories.push(catName); });
      form.reset();
    }

    if(type === 'set-budget'){
      var bcat = fd.get('category');
      var bval = parseFloat(fd.get('value')) || 0;
      if(!bcat) return;
      update(function(){ if(bval > 0) state.budgets[bcat] = bval; else delete state.budgets[bcat]; });
      form.reset();
    }

    if(type === 'transaction'){
      var value = parseFloat(fd.get('value'));
      var date = fd.get('date') || todayISO();
      var desc = (fd.get('desc')||'').trim();
      var category = (fd.get('category')||'').trim();
      var forma = fd.get('forma');
      var isCard = forma === 'Cartão de Crédito';
      var isTransfer = forma === 'Transferência';
      var tipo = isTransfer ? 'saida' : fd.get('tipo');

      if(isTransfer){
        var origemId = fd.get('origemId'), destinoId = fd.get('destinoId');
        if(!value || !desc || !origemId || !destinoId || origemId===destinoId) return;
        if(!category) category = 'Transferência interna';
        if(state.categories.indexOf(category)===-1) state.categories.push(category);
        update(function(){
          if(id && state.editing.transferId){
            var pair = state.transactions.filter(function(x){return x.transferId===state.editing.transferId;});
            var saidaLeg = pair.filter(function(x){return x.tipo==='saida';})[0];
            var entradaLeg = pair.filter(function(x){return x.tipo==='entrada';})[0];
            if(saidaLeg){ Object.assign(saidaLeg, { value:value, date:date, desc:desc, category:category, accountId:origemId }); }
            if(entradaLeg){ Object.assign(entradaLeg, { value:value, date:date, desc:desc, category:category, accountId:destinoId }); }
          }else{
            var transferId = uid();
            state.transactions.push({ id:uid(), value:value, date:date, desc:desc, category:category, forma:'Transferência', tipo:'saida', accountId:origemId, cardId:null, invoiceCycleKey:null, installment:null, isTransfer:true, transferId:transferId });
            state.transactions.push({ id:uid(), value:value, date:date, desc:desc, category:category, forma:'Transferência', tipo:'entrada', accountId:destinoId, cardId:null, invoiceCycleKey:null, installment:null, isTransfer:true, transferId:transferId });
          }
          state.editing={type:null,id:null,transferId:null}; state.txDraft=freshTxDraft();
        });
        return;
      }

      var accountId = isCard ? null : fd.get('accountId');
      var cardId = isCard ? fd.get('cardId') : null;
      var cycleOverride = isCard ? fd.get('invoiceCycleOverride') : null;
      var applyToFollowing = fd.get('applyToFollowing') === 'on';
      if(!value || !desc || !category) return;
      if(isCard && !cardId) return;
      if(!isCard && !accountId) return;
      if(category && state.categories.indexOf(category)===-1) state.categories.push(category);

      update(function(){
        if(id){
          var existing = state.transactions.filter(function(t){return t.id===id;})[0];
          var patch = { value:value, date:date, desc:desc, category:category, forma:forma, tipo:tipo, accountId:accountId, cardId:cardId };
          if(isCard){
            var cardObjE = state.cards.filter(function(c){return c.id===cardId;})[0];
            patch.invoiceCycleKey = cycleOverride || (cardObjE ? cycleKey(invoiceCycleForDate(cardObjE, toLocalDate(date))) : null);
          }else{ patch.invoiceCycleKey = null; patch.installment = null; patch.installmentGroupId = null; }
          Object.assign(existing, patch);
          if(applyToFollowing && existing.installmentGroupId){
            var gid = existing.installmentGroupId, fromN = existing.installment.current;
            state.transactions.forEach(function(x){
              if(x.installmentGroupId===gid && x.installment && x.installment.current > fromN){
                x.value = value; x.desc = desc; x.category = category; x.forma = forma; x.tipo = tipo; x.cardId = cardId;
              }
            });
          }
        }else{
          if(isCard){
            var cardObj = state.cards.filter(function(c){return c.id===cardId;})[0];
            var n = clampInt(fd.get('installments')||1, 1, 24);
            var baseCycle = cycleOverride ? parseCycleKey(cycleOverride) : invoiceCycleForDate(cardObj, toLocalDate(date));
            var cents = Math.round(value*100);
            var base = Math.floor(cents/n), rem = cents - base*n;
            var groupId = n > 1 ? uid() : null;
            for(var i=0;i<n;i++){
              var amtCents = base + (i<rem?1:0);
              var cyc = addMonthsToCycle(baseCycle, i);
              var txDate = i===0 ? date : (function(){ var dd = cycleOpenDate(cardObj, cyc); return dd.getFullYear()+'-'+pad2(dd.getMonth()+1)+'-'+pad2(dd.getDate()); })();
              state.transactions.push({ id:uid(), value:amtCents/100, date:txDate, desc:desc, category:category, forma:forma, tipo:tipo, accountId:null, cardId:cardId, invoiceCycleKey:cycleKey(cyc), installment: n>1?{current:i+1,total:n}:null, installmentGroupId: groupId });
            }
          }else{
            state.transactions.push({ id:uid(), value:value, date:date, desc:desc, category:category, forma:forma, tipo:tipo, accountId:accountId, cardId:null, invoiceCycleKey:null, installment:null });
          }
        }
        state.editing={type:null,id:null,transferId:null}; state.txDraft=freshTxDraft();
      });
    }
  });

  window.addEventListener('error', function(e){
    var el = document.getElementById('fatal-error');
    if(!el){ el=document.createElement('div'); el.id='fatal-error'; el.style.cssText='position:fixed;top:0;left:0;right:0;background:#5c1c1c;color:#fff;padding:10px 16px;font:12px monospace;z-index:9999;'; document.body.insertBefore(el, document.body.firstChild); }
    el.textContent = 'Erro no app: ' + e.message + ' (linha ' + e.lineno + ')';
  });

  loadState();
})();
</script>
</body>
</html>
