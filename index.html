        var menuOpen = state.openBillMenu === b.id;

        var row = '<div class="list-item"><div class="li-main"><div class="li-title">'+esc(b.name)+parcelaInfo+(b.natureza==='receita'?' <span class="tag">receita</span>':'')+'</div>'
          + '<div class="li-sub">Vence em '+fmtDateObj(due)+(b.natureza==='receita'?'':' - '+(formaLabel?formaLabel.l:''))+'</div></div>'
          + '<span class="badge '+st.cls+'">'+st.label+'</span><div class="li-value '+(b.natureza==='receita'?'entrada':'saida')+'">'+fmtBRL(billValueInMonth(b, bm))+'</div>'
          + '<div class="li-actions">'
          + (paidThisMonth ? '' : '<button type="button" class="btn btn-primary btn-small" data-action="start-launch" data-id="'+b.id+'">Lançar</button>')
          + '<button type="button" class="icon-btn" data-action="toggle-bill-menu" data-id="'+b.id+'">&#8942;</button>'
          + '</div></div>';

        if(menuOpen){
          row += '<div class="li-actions" style="justify-content:flex-end;margin-top:-4px;">'
            + '<button type="button" class="icon-btn" data-action="edit-bill" data-id="'+b.id+'">Editar</button>'
            + (viaTransaction ? '' : (viaManual
                ? '<button type="button" class="icon-btn" data-action="toggle-manual-paid" data-id="'+b.id+'">Desmarcar como pago</button>'
                : '<button type="button" class="icon-btn" data-action="toggle-manual-paid" data-id="'+b.id+'">Marcar como pago (sem descontar)</button>'))
            + (b.endMonth
                ? '<button type="button" class="icon-btn" data-action="bill-end" data-id="'+b.id+'" data-mode="clear">Remover encerramento</button>'
                : '<button type="button" class="icon-btn" data-action="bill-end" data-id="'+b.id+'" data-mode="set">Encerrar a partir deste mês</button>')
            + '<button type="button" class="icon-btn '+(confirming?'confirm':'danger')+'" data-action="delete-bill" data-id="'+b.id+'">'+(confirming?'Confirmar':'Excluir de todos os meses')+'</button>'
            + '</div>';
        }

        if(isLaunching){
          var accOptsL = state.accounts.map(function(a){return '<option value="'+a.id+'" '+(b.accountId===a.id?'selected':'')+'>'+esc(a.name)+'</option>';}).join('');
          var defDate = isCurMonth ? todayISO() : (due.getFullYear()+'-'+pad2(due.getMonth()+1)+'-'+pad2(due.getDate()));
          row += '<form class="inline-form" data-form="launch-bill" data-bill-id="'+b.id+'" data-month="'+bm+'" style="margin-top:-2px;">'
            + '<div class="form-row date-row"><div class="date-field"><label>Data do pagamento</label><input type="date" name="date" value="'+defDate+'" required></div></div>'
            + '<div class="form-row">'
            + '<div><label>Valor real (R$)</label><input type="number" step="0.01" min="0.01" name="value" value="'+b.value+'" required></div>'
            + (b.forma==='cartao' ? '' : '<div><label>Conta</label><select name="accountId" required>'+(state.accounts.length?accOptsL:'<option value="">Cadastre uma conta primeiro</option>')+'</select></div>')
            + '</div>'
            + '<div class="settings-note" style="margin:0;">Fica registrada como a conta de '+monthLabel(bm)+', mesmo que a data do pagamento seja em outro mês.</div>'
            + '<div class="form-actions"><button type="button" class="btn btn-ghost btn-small" data-action="cancel-launch">Cancelar</button><button type="submit" class="btn btn-primary btn-small">Confirmar</button></div></form>';
        }
        return row;
      }).join('') + '</div>';
    }
    return html;
  }

  // ---------- report ----------
  function renderReport(){
    var f = state.reportFilter;
    var range = resolveReportRange();
    var tipoR = f.tipo || 'saida';
    var totals = categoryTotalsInRange(range.from, range.to, tipoR, f);
    var totalPeriodo = totals.reduce(function(s,c){return s+c[1];}, 0);
    var fSemCat = Object.assign({}, f, { categoria:'' });
    var totalDoado = totalByTipoInRange('presente', range.from, range.to, fSemCat);
    var totalInvestido = totalByTipoInRange('investimento', range.from, range.to, fSemCat);

    // resumo do mes: fixas pelo cadastro (ou valor lancado) + variaveis sem conta fixa, sem contar pagamento de fatura
    var sm = f.mode==='month' ? f.month : currentMonthKey();
    var smp = sm.split('-').map(Number);
    var smFrom = new Date(smp[0], smp[1]-1, 1), smTo = new Date(smp[0], smp[1], 0);
    var receitaFixaPrevista = 0, gastoFixoPrevisto = 0;
    billsForMonth(sm).forEach(function(b){
      var v = billValueInMonth(b, sm);
      if(b.natureza==='receita') receitaFixaPrevista += v; else gastoFixoPrevisto += v;
    });
    var totalEntradaAvulsa = 0, gastoVariavel = 0;
    state.transactions.forEach(function(t){
      if(t.isTransfer || isInvoicePayment(t) || t.billId) return;
      var dt = toLocalDate(t.date); if(dt < smFrom || dt > smTo) return;
      if(t.tipo==='entrada') totalEntradaAvulsa += Number(t.value);
      else if(t.tipo==='saida') gastoVariavel += Number(t.value);
    });
    var dizimosMes = totalByTipoInRange('presente', smFrom, smTo, null);
    var sobraPrevista = receitaFixaPrevista + totalEntradaAvulsa - gastoFixoPrevisto - gastoVariavel - dizimosMes;
    var TIPO_LABEL = { saida:'gastos', entrada:'receitas', presente:'dízimos / ofertas', investimento:'investimentos' };
    var rMonthFrom = range.from.getFullYear()+'-'+pad2(range.from.getMonth()+1), rMonthTo = range.to.getFullYear()+'-'+pad2(range.to.getMonth()+1);
    var nMonths = Math.max(1, monthDiff(rMonthFrom, rMonthTo) + 1);

    var modeSelect = '<select data-action="report-mode-change">'
      + '<option value="month" '+(f.mode==='month'?'selected':'')+'>Mês específico</option>'
      + '<option value="last3" '+(f.mode==='last3'?'selected':'')+'>Últimos 3 meses</option>'
      + '<option value="last6" '+(f.mode==='last6'?'selected':'')+'>Últimos 6 meses</option>'
      + '<option value="year" '+(f.mode==='year'?'selected':'')+'>Este ano</option>'
      + '<option value="custom" '+(f.mode==='custom'?'selected':'')+'>Personalizado</option></select>';

    var html = '<div class="form-row" style="margin-bottom:12px;"><div><label>Período</label>'+modeSelect+'</div>';
    if(f.mode==='month'){
      html += '<div><label>&nbsp;</label><div class="month-picker"><button type="button" data-action="report-prev">&lt;</button><span class="label">'+monthLabel(f.month)+'</span><button type="button" data-action="report-next">&gt;</button></div></div>';
    }else if(f.mode==='custom'){
      html += '<div class="date-field"><label>De</label><input type="date" data-action="report-from-change" value="'+esc(f.from)+'"></div><div class="date-field"><label>Até</label><input type="date" data-action="report-to-change" value="'+esc(f.to)+'"></div>';
    }
    html += '</div>';

    html += '<div class="form-row" style="margin-bottom:14px;">'
      + '<div><label>Tipo</label><select data-action="report-filter-tipo">'+['saida','entrada','presente','investimento'].map(function(v){ var o = TIPOS.filter(function(x){return x.v===v;})[0]; return '<option value="'+v+'" '+(tipoR===v?'selected':'')+'>'+o.l+'</option>'; }).join('')+'</select></div>'
      + '<div><label>Categoria</label><select data-action="report-filter-categoria"><option value="">Todas</option>'+optionsHTML(categoryListForTipo(tipoR), f.categoria)+'</select></div>'
      + '<div><label>Conta</label><select data-action="report-filter-conta"><option value="">Todas</option>'+state.accounts.map(function(a){return '<option value="'+a.id+'" '+(f.conta===a.id?'selected':'')+'>'+esc(a.name)+'</option>';}).join('')+'</select></div>'
      + '<div><label>Cartão</label><select data-action="report-filter-cartao"><option value="">Todos</option>'+state.cards.map(function(c){return '<option value="'+c.id+'" '+(f.cartao===c.id?'selected':'')+'>'+esc(c.name)+'</option>';}).join('')+'</select></div>'
      + '</div>';

    html += '<div class="section-title">Resumo fixo x variável - '+monthLabel(sm)+'</div>';
    html += '<div class="summary-grid">'
      + '<div class="mini-card"><div class="name">Receita fixa</div><div class="val" style="color:var(--green)">'+fmtBRL(receitaFixaPrevista)+'</div></div>'
      + '<div class="mini-card"><div class="name">Renda extra</div><div class="val" style="color:var(--green)">'+fmtBRL(totalEntradaAvulsa)+'</div></div>'
      + '<div class="mini-card"><div class="name">Gasto fixo</div><div class="val" style="color:var(--red)">'+fmtBRL(gastoFixoPrevisto)+'</div></div>'
      + '<div class="mini-card"><div class="name">Gastos variáveis</div><div class="val" style="color:var(--red)">'+fmtBRL(gastoVariavel)+'</div></div>'
      + '<div class="mini-card"><div class="name">Dízimos / ofertas</div><div class="val" style="color:var(--accent2)">'+fmtBRL(dizimosMes)+'</div></div>'
      + '<div class="mini-card"><div class="name">Sobra prevista</div><div class="val '+(sobraPrevista<0?'neg':'')+'">'+fmtBRL(sobraPrevista)+'</div></div>'
      + '</div>';

    html += '<div id="report-capture" class="export-surface">';
    html += '<div class="card"><div class="hero-label">Total de '+TIPO_LABEL[tipoR]+' - '+reportRangeLabel()+'</div><div class="hero-value" style="font-size:24px;">'+fmtBRL(totalPeriodo)+'</div></div>';
    if(tipoR==='saida' && (totalDoado>0 || totalInvestido>0)){
      html += '<div class="summary-grid">'
        + (totalDoado>0 ? '<div class="mini-card"><div class="name">Dízimos / ofertas</div><div class="val" style="color:var(--accent2)">'+fmtBRL(totalDoado)+'</div></div>' : '')
        + (totalInvestido>0 ? '<div class="mini-card"><div class="name">Total investido</div><div class="val" style="color:var(--accent2)">'+fmtBRL(totalInvestido)+'</div></div>' : '')
        + '</div>';
    }

    html += '<div class="grid-2">'
      + '<div class="chart-wrap"><div class="section-title" style="margin-top:0;">Por categoria</div><canvas id="chart-pie"></canvas></div>'
      + '<div class="chart-wrap"><div class="section-title" style="margin-top:0;">Evolução - últimos 6 meses</div><canvas id="chart-trend"></canvas></div>'
      + '</div>';

    html += '<div class="section-title">Detalhamento e orçamento</div>';
    if(totals.length===0){
      html += '<div class="empty">Nenhum lançamento deste tipo no período com esses filtros.</div>';
    }else{
      html += '<div>' + totals.map(function(c){
        var pct = totalPeriodo>0 ? (c[1]/totalPeriodo*100) : 0;
        var budgetMes = tipoR==='saida' ? state.budgets[c[0]] : 0;
        var budget = budgetMes ? budgetMes * nMonths : 0; // orcamento mensal x meses do periodo
        var budgetLine = '';
        if(budget){
          var bpct = Math.min(100, (c[1]/budget)*100);
          var over = c[1] > budget;
          budgetLine = '<div class="bar-track" style="margin-top:4px;"><div class="bar-fill '+(over?'over':'')+'" style="width:'+bpct+'%"></div></div>'
            + '<div style="font-size:11px;color:'+(over?'var(--red)':'var(--text-faint)')+';margin-top:2px;">Orçamento: '+fmtBRL(budget)+(nMonths>1?' ('+nMonths+' meses x '+fmtBRL(budgetMes)+')':'')+(over?' - estourou em '+fmtBRL(c[1]-budget):'')+'</div>';
        }
        return '<div class="report-row"><div class="report-head"><span class="report-cat">'+esc(c[0])+'</span><span class="report-val">'+fmtBRL(c[1])+' - '+pct.toFixed(0)+'%</span></div>'
          + '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div>'+budgetLine+'</div>';
      }).join('') + '</div>';
    }
    html += '</div>';

    html += '<div class="form-actions" style="margin-top:14px;"><button type="button" class="btn btn-ghost" data-action="export-image">Exportar imagem (PNG)</button><button type="button" class="btn btn-ghost" data-action="export-pdf">Exportar PDF</button></div><div class="export-status" id="export-status"></div>';
    return html;
  }

  function drawCharts(){
    if(state.tab !== 'report') return;
    if(typeof Chart === 'undefined') return;
    var range = resolveReportRange();
    var f = state.reportFilter, tipoR = f.tipo || 'saida';
    var totals = categoryTotalsInRange(range.from, range.to, tipoR, f);
    var pieEl = document.getElementById('chart-pie');
    if(pieEl){
      if(charts.pie){ charts.pie.destroy(); charts.pie = null; }
      var palette = ['#6EE7C7','#60A5FA','#FBBF24','#FB7676','#A78BFA','#34D399','#F472B6','#38BDF8','#FDBA74','#94A3B8','#F87171','#4ADE80'];
      charts.pie = new Chart(pieEl.getContext('2d'), { type:'doughnut', data:{ labels:totals.map(function(c){return c[0];}), datasets:[{ data:totals.map(function(c){return c[1];}), backgroundColor:palette, borderWidth:0 }] }, options:{ plugins:{ legend:{ position:'bottom', labels:{ color:'#8A93A6', boxWidth:10, font:{size:11} } } } } });
    }
    var trendEl = document.getElementById('chart-trend');
    if(trendEl){
      if(charts.trend){ charts.trend.destroy(); charts.trend = null; }
      var trend = last6MonthsTrend(tipoR, f);
      charts.trend = new Chart(trendEl.getContext('2d'), { type:'bar', data:{ labels:trend.map(function(t){return t.label;}), datasets:[{ data:trend.map(function(t){return t.total;}), backgroundColor:'#6EE7C7', borderRadius:4 }] }, options:{ plugins:{ legend:{ display:false } }, scales:{ x:{ ticks:{ color:'#8A93A6' }, grid:{ display:false } }, y:{ ticks:{ color:'#8A93A6' }, grid:{ color:'#24304A' } } } } });
    }
  }

    html += '<div class="section-title">Categorias de receita<button type="button" class="icon-btn" data-action="toggle-income-categories-open">'+(state.incomeCategoriesOpen?'Recolher':'('+state.incomeCategories.length+') Ver / editar')+'</button></div>';
    if(state.incomeCategoriesOpen){
      html += '<form class="inline-form" data-form="add-income-category"><div class="form-row"><div><label>Nova categoria de receita</label><input type="text" name="name" placeholder="Ex: Reembolso" required></div></div><div class="form-actions"><button type="submit" class="btn btn-primary btn-small">Adicionar categoria</button></div></form>';
      html += '<div class="list">' + state.incomeCategories.map(function(cat){
        var delKey = 'income-category:'+cat;
        var confirming = state.confirmingDeleteKey === delKey;
        return '<div class="list-item"><div class="li-main"><div class="li-title">'+esc(cat)+'</div></div>'
          + '<div class="li-actions"><button type="button" class="icon-btn '+(confirming?'confirm':'danger')+'" data-action="delete-income-category" data-id="'+esc(cat)+'">'+(confirming?'Confirmar':'Excluir')+'</button></div></div>';
      }).join('') + '</div>';
    }

    html += '<div class="section-title">Orçamento por categoria (mensal, editável a qualquer momento)</div>';
    html += '<form class="inline-form" data-form="set-budget"><div class="form-row">'
      + '<div><label>Categoria</label><select name="category">'+optionsHTML(state.categories, '')+'</select></div>'
      + '<div><label>Orçamento (R$)</label><input type="number" step="0.01" min="0" name="value" placeholder="0 remove o orçamento"></div>'
      + '</div><div class="form-actions"><button type="submit" class="btn btn-primary btn-small">Salvar orçamento</button></div></form>';
    var budgetKeys = Object.keys(state.budgets).filter(function(k){ return state.budgets[k] > 0; });
    if(budgetKeys.length){
      html += '<div class="list">' + budgetKeys.map(function(k){
        return '<div class="list-item"><div class="li-main"><div class="li-title">'+esc(k)+'</div></div><div class="li-value">'+fmtBRL(state.budgets[k])+'</div></div>';

    }).join('') + '</div>';

    html += settingsHTML();
    return html;
  }

  function setExportStatus(msg){ var el = document.getElementById('export-status'); if(el) el.textContent = msg; }
  function exportImage(){
    var el = document.getElementById('report-capture'); if(!el) return;
    if(typeof html2canvas==='undefined'){ setExportStatus('Recurso ainda carregando, tente de novo em instantes.'); return; }
    setExportStatus('Gerando imagem...');
    html2canvas(el,{backgroundColor:'#0B1220'}).then(function(canvas){
      var link=document.createElement('a'); link.download='relatorio-financas.png'; link.href=canvas.toDataURL('image/png'); link.click();
      setExportStatus('Imagem exportada.');
    }).catch(function(){ setExportStatus('Erro ao exportar imagem.'); });
  }
  function exportPDF(){
    var el = document.getElementById('report-capture'); if(!el) return;
    if(typeof html2canvas==='undefined' || typeof window.jspdf==='undefined'){ setExportStatus('Recurso ainda carregando, tente de novo em instantes.'); return; }
    setExportStatus('Gerando PDF...');
    html2canvas(el,{backgroundColor:'#0B1220'}).then(function(canvas){
      var jsPDF = window.jspdf.jsPDF;
      var pdf = new jsPDF({ orientation:'portrait', unit:'pt', format:'a4' });
      var pageWidth = pdf.internal.pageSize.getWidth();
      var imgW = pageWidth-40, imgH = canvas.height*(imgW/canvas.width);
      pdf.addImage(canvas.toDataURL('image/png'),'PNG',20,20,imgW,imgH);
      pdf.save('relatorio-financas.pdf');
      setExportStatus('PDF exportado.');
    }).catch(function(){ setExportStatus('Erro ao exportar PDF.'); });
  }

  // ---------- event delegation ----------
  document.addEventListener('click', function(e){
    var btn = e.target.closest('[data-action]');
    if(!btn) return;
    var action = btn.dataset.action;
    var isDeleteAction = action.indexOf('delete-') === 0 || action === 'reset-all';

    if(action==='toggle-categories-open'){ state.categoriesOpen = !state.categoriesOpen; render(); return; }
    if(action==='toggle-income-categories-open'){ state.incomeCategoriesOpen = !state.incomeCategoriesOpen; render(); return; }
    if(action==='toggle-presente-categories-open'){ state.presenteCategoriesOpen = !state.presenteCategoriesOpen; render(); return; }
    if(action==='toggle-nav'){ state.navOpen = !state.navOpen; render(); return; }
    if(action==='close-nav'){ state.navOpen = false; render(); return; }
    if(action==='go-tab'){
      state.tab=btn.dataset.tab; state.navOpen=false; state.editing={type:null,id:null,transferId:null};
      state.confirmingDeleteKey=null; state.txDraft=freshTxDraft(); state.billDraft=freshBillDraft();
      state.payingCycle=null; state.launchingBillId=null; state.openBillMenu=null; render(); return;
    }
    if(action==='cancel-edit'){ state.editing={type:null,id:null,transferId:null}; state.txDraft=freshTxDraft(); state.billDraft=freshBillDraft(); state.openBillMenu=null; render(); return; }
    if(action==='toggle-bill-menu'){ state.openBillMenu = (state.openBillMenu===btn.dataset.id) ? null : btn.dataset.id; render(); return; }
    if(action==='bills-month-prev' || action==='bills-month-next' || action==='bills-month-today'){
      state.billsMonth = action==='bills-month-today' ? currentMonthKey() : shiftMonth(state.billsMonth, action==='bills-month-prev' ? -1 : 1);
      state.launchingBillId = null; state.openBillMenu = null; render(); return;
    }
    if(action==='bill-end'){
      var billE = state.fixedBills.filter(function(x){return x.id===btn.dataset.id;})[0];
      if(!billE) return;
      var modeE = btn.dataset.mode;
      update(function(){ if(modeE==='clear') delete billE.endMonth; else billE.endMonth = shiftMonth(state.billsMonth, -1); state.openBillMenu = null; });
      return;
    }
    if(action==='toggle-manual-paid'){
      var billId2 = btn.dataset.id;
      var bill2 = state.fixedBills.filter(function(x){return x.id===billId2;})[0];
      var mk2 = state.billsMonth;
      update(function(){
        bill2.manuallyPaidMonths = bill2.manuallyPaidMonths || [];
        var idx = bill2.manuallyPaidMonths.indexOf(mk2);
        if(idx >= 0) bill2.manuallyPaidMonths.splice(idx,1); else bill2.manuallyPaidMonths.push(mk2);
        state.openBillMenu = null;
      });
      return;
    }
    if(action==='toggle-card-expand'){ var cid=btn.dataset.id; state.expandedCards[cid]=!state.expandedCards[cid]; render(); return; }
    if(action.indexOf('edit-')===0 && action!=='edit'){
      var type = action.replace('edit-','');
      if(type==='transaction'){
        var t = state.transactions.filter(function(x){return x.id===btn.dataset.id;})[0];
        state.txDraft = seedTxDraft(t);
        state.editing = { type:'transaction', id: t.id, transferId: t.transferId||null };
      }else if(type==='bill'){
        var b = state.fixedBills.filter(function(x){return x.id===btn.dataset.id;})[0];
        state.billDraft = seedBillDraft(b);
        state.editing = { type:'bill', id: b.id, transferId:null };
      }else{
        state.editing = { type:type, id: btn.dataset.id, transferId:null };
      }
      state.confirmingDeleteKey=null;
      render(); window.scrollTo({top:0,behavior:'smooth'});
      return;
    }
    if(action==='start-pay'){ state.payingCycle = btn.dataset.cardId+':'+btn.dataset.cycle; render(); return; }
    if(action==='cancel-pay'){ state.payingCycle = null; render(); return; }
    if(action==='start-launch'){ state.launchingBillId = btn.dataset.id; render(); return; }
    if(action==='cancel-launch'){ state.launchingBillId = null; render(); return; }
    if(action==='refresh-now'){ loadState(); return; }
    if(action==='tx-month-prev'){ state.txMonth = state.txMonth==='todos' ? shiftMonth(currentMonthKey(),-1) : shiftMonth(state.txMonth,-1); render(); return; }
    if(action==='tx-month-next'){ state.txMonth = state.txMonth==='todos' ? shiftMonth(currentMonthKey(),1) : shiftMonth(state.txMonth,1); render(); return; }
    if(action==='tx-month-all'){ state.txMonth = 'todos'; render(); return; }
    if(action==='report-prev'){ state.reportFilter.month = shiftMonth(state.reportFilter.month,-1); render(); return; }
    if(action==='report-next'){ state.reportFilter.month = shiftMonth(state.reportFilter.month, 1); render(); return; }
    if(action==='export-image'){ exportImage(); return; }
    if(action==='export-pdf'){ exportPDF(); return; }

    if(action==='delete-transaction-group'){
      var key = 'transaction-group:'+btn.dataset.id;
      if(state.confirmingDeleteKey === key){
        var target = state.transactions.filter(function(x){return x.id===btn.dataset.id;})[0];
        if(target && target.installmentGroupId){
          var gid = target.installmentGroupId, fromN = target.installment.current;
          update(function(){
            state.transactions = state.transactions.filter(function(x){
              return !(x.installmentGroupId===gid && x.installment && x.installment.current >= fromN);
            });
            state.confirmingDeleteKey = null;
          });
        }
      }else{
        state.confirmingDeleteKey = key; render();
        setTimeout(function(){ if(state.confirmingDeleteKey===key){ state.confirmingDeleteKey=null; render(); } }, 3500);
      }
      return;
    }

    if(isDeleteAction){
      var key2 = action==='reset-all' ? 'reset-all' : (action.replace('delete-','') + ':' + btn.dataset.id);
      if(state.confirmingDeleteKey === key2){
        if(action==='reset-all'){
          update(function(){ state.accounts=[]; state.cards=[]; state.transactions=[]; state.fixedBills=[]; state.confirmingDeleteKey=null; });
        }else if(action==='delete-category'){
          update(function(){ state.categories = state.categories.filter(function(c){return c!==btn.dataset.id;}); delete state.budgets[btn.dataset.id]; state.confirmingDeleteKey=null; });
        }else if(action==='delete-income-category'){
          update(function(){ state.incomeCategories = state.incomeCategories.filter(function(c){return c!==btn.dataset.id;}); state.confirmingDeleteKey=null; });
        }else if(action==='delete-presente-category'){
          update(function(){ state.presenteCategories = state.presenteCategories.filter(function(c){return c!==btn.dataset.id;}); state.confirmingDeleteKey=null; });
        }else if(action==='delete-transaction'){
          var delId = btn.dataset.id;
          update(function(){
            var tgt = state.transactions.filter(function(x){return x.id===delId;})[0];
            if(tgt && isInvoicePayment(tgt)) revertInvoicePayment(tgt);
            if(tgt && tgt.isTransfer && tgt.transferId){
              state.transactions = state.transactions.filter(function(x){return x.transferId!==tgt.transferId;});
            }else{
              state.transactions = state.transactions.filter(function(x){return x.id!==delId;});
            }
            state.confirmingDeleteKey = null;
          });
        }else{
          var parts = key2.split(':'); var tt=parts[0], id=parts[1];
          update(function(){
            if(tt==='account') state.accounts = state.accounts.filter(function(x){return x.id!==id;});
            if(tt==='card') state.cards = state.cards.filter(function(x){return x.id!==id;});
            if(tt==='bill') state.fixedBills = state.fixedBills.filter(function(x){return x.id!==id;});
            state.confirmingDeleteKey = null;
          });
        }
      }else{
        state.confirmingDeleteKey = key2; render();
        setTimeout(function(){ if(state.confirmingDeleteKey===key2){ state.confirmingDeleteKey=null; render(); } }, 3500);
      }
      return;
    }
  });

  function setSelectIfOption(sel, val){
    if(!sel || !val) return false;
    for(var i=0;i<sel.options.length;i++){ if(sel.options[i].value===val){ sel.value = val; return true; } }
    return false;
  }
  function applyAutocomplete(form){
    if(state.editing.type === 'transaction') return;
    var d = state.txDraft;
    var m = findAutocompleteMatch(d.desc);
    var hint = form.querySelector('#autocomplete-hint');
    if(!m || m.isTransfer || isInvoicePayment(m) || m.billId || m.tipo !== d.tipo){ if(hint) hint.style.display = 'none'; return; }
    var formaList = d.tipo==='entrada' ? FORMAS_RECEITA : FORMAS;
    var formaChanged = m.forma && formaList.indexOf(m.forma)!==-1 && m.forma !== d.forma;
    if(formaChanged) d.forma = m.forma;
    if(m.category) d.category = m.category;
    if(m.cardId) d.cardId = m.cardId;
    if(m.accountId) d.accountId = m.accountId;
    if(formaChanged){
      // muda os campos do formulario (ex.: conta -> cartao), entao redesenha e devolve o foco
      render();
      var inp = document.querySelector('form[data-form="transaction"] input[name="desc"]');
      if(inp){ inp.focus(); var L = inp.value.length; try{ inp.setSelectionRange(L, L); }catch(err){} }
      return;
    }
    setSelectIfOption(form.querySelector('select[name="category"]'), m.category);
    setSelectIfOption(form.querySelector('select[name="accountId"]'), m.accountId);
    if(setSelectIfOption(form.querySelector('select[name="cardId"]'), m.cardId)) refreshCycleOptions(form);
    if(hint) hint.style.display = '';
  }

  document.addEventListener('input', function(e){
    var t = e.target;
    if(!t.name) return;
    var txForm = t.closest('form[data-form="transaction"]');
    if(txForm){ state.txDraft[t.name] = t.value; if(t.name==='date'){ refreshCycleOptions(txForm); } if(t.name==='desc'){ applyAutocomplete(txForm); } return; }
    var billForm = t.closest('form[data-form="bill"]');
    if(billForm){ state.billDraft[t.name] = t.value; return; }
  });

  document.addEventListener('change', function(e){
    var t = e.target;
    if(t.name){
      var txForm = t.closest('form[data-form="transaction"]');
      if(txForm){ state.txDraft[t.name] = (t.type==='checkbox' ? t.checked : t.value); }
      var billForm = t.closest('form[data-form="bill"]');
      if(billForm){ state.billDraft[t.name] = t.value; }
    }
    if(!t.dataset) return;
    if(t.dataset.action === 'forma-change'){ render(); }
    else if(t.dataset.action === 'tipo-change'){ render(); }
    else if(t.dataset.action === 'card-select-change'){ refreshCycleOptions(t.closest('form')); }
    else if(t.dataset.action === 'owner-filter-change'){ state.filterTitular = t.value; render(); }
    else if(t.dataset.action === 'bill-tipo-change'){ render(); }
    else if(t.dataset.action === 'bill-natureza-change'){ render(); }
    else if(t.dataset.action === 'bill-forma-change'){ render(); }
    else if(t.dataset.action === 'vencimentos-sort-change'){ state.vencimentosSort = t.value; persist(); render(); }
    else if(t.dataset.action === 'vencimentos-month-change'){ state.vencimentosMonth = t.value; persist(); render(); }
    else if(t.dataset.action === 'report-mode-change'){ state.reportFilter.mode = t.value; render(); }
    else if(t.dataset.action === 'report-from-change'){ state.reportFilter.from = t.value; render(); }
    else if(t.dataset.action === 'report-to-change'){ state.reportFilter.to = t.value; render(); }
    else if(t.dataset.action === 'report-filter-categoria'){ state.reportFilter.categoria = t.value; persist(); render(); }
    else if(t.dataset.action === 'report-filter-conta'){ state.reportFilter.conta = t.value; persist(); render(); }
    else if(t.dataset.action === 'report-filter-cartao'){ state.reportFilter.cartao = t.value; persist(); render(); }
    else if(t.dataset.action === 'report-filter-tipo'){ state.reportFilter.tipo = t.value; if(categoryListForTipo(t.value).indexOf(state.reportFilter.categoria)===-1) state.reportFilter.categoria=''; persist(); render(); }
    else if(t.dataset.action === 'tx-filter-tipo'){ state.txFilter.tipo = t.value; if(categoryListForTipo(t.value).indexOf(state.txFilter.categoria)===-1) state.txFilter.categoria=''; persist(); render(); }
    else if(t.dataset.action === 'tx-filter-categoria'){ state.txFilter.categoria = t.value; persist(); render(); }
    else if(t.dataset.action === 'tx-filter-conta'){ state.txFilter.conta = t.value; persist(); render(); }
    else if(t.dataset.action === 'tx-filter-cartao'){ state.txFilter.cartao = t.value; persist(); render(); }
    else if(t.dataset.action === 'titular-color-change'){ update(function(){ state.titularColors[t.dataset.titular] = t.value; }); }
  });

  document.addEventListener('submit', function(e){
    var form = e.target.closest('form[data-form]');
    if(!form) return;
    e.preventDefault();
    var type = form.dataset.form;
    var fd = new FormData(form);
    var id = fd.get('id');

    if(type === 'account'){
      var name=(fd.get('name')||'').trim(), titular=(fd.get('titular')||'').trim();
      var saldoInicial = parseFloat(fd.get('saldoInicial'))||0;
      var isInvestment = fd.get('isInvestment')==='on';
      if(!name) return;
      update(function(){
        if(id){ var acc=state.accounts.filter(function(a){return a.id===id;})[0]; acc.name=name; acc.titular=titular; acc.saldoInicial=saldoInicial; acc.isInvestment=isInvestment; }
        else{ state.accounts.push({ id:uid(), name:name, titular:titular, saldoInicial:saldoInicial, isInvestment:isInvestment }); if(titular && !state.titularColors[titular]) state.titularColors[titular]=DEFAULT_COLORS[titular]||'#60A5FA'; }
        state.editing={type:null,id:null,transferId:null};
      });
    }

    if(type === 'card'){
      var cname=(fd.get('name')||'').trim(), ctitular=(fd.get('titular')||'').trim();
      var closingDay=clampInt(fd.get('closingDay'),1,31), dueDay=clampInt(fd.get('dueDay'),1,31);
      var limit=parseFloat(fd.get('limit'))||0;
      if(!cname) return;
      update(function(){
        if(id){ var c=state.cards.filter(function(x){return x.id===id;})[0]; c.name=cname; c.titular=ctitular; c.closingDay=closingDay; c.dueDay=dueDay; c.limit=limit; }
        else{ state.cards.push({ id:uid(), name:cname, titular:ctitular, closingDay:closingDay, dueDay:dueDay, limit:limit, paymentsByCycle:{} }); if(ctitular && !state.titularColors[ctitular]) state.titularColors[ctitular]=DEFAULT_COLORS[ctitular]||'#F472B6'; }
        state.editing={type:null,id:null,transferId:null};
      });
    }

    if(type === 'bill'){
      var bname=(fd.get('name')||'').trim();
      var natureza = fd.get('natureza');
      var bvalue = parseFloat(fd.get('value'));
      var bDueDay = clampInt(fd.get('dueDay'),1,31);
      var tipoRecorrencia = fd.get('tipoRecorrencia');
      var totalParcelas = tipoRecorrencia==='parcelada' ? clampInt(fd.get('totalParcelas'),2,360) : null;
      var forma = natureza==='receita' ? 'debito_automatico' : fd.get('forma');
      var cardId = forma==='cartao' ? fd.get('cardId') : null;
      var accountId = forma!=='cartao' ? (fd.get('accountId')||null) : null;
      var startMonth = (fd.get('startMonth')||'').trim();
      if(!/^\d{4}-\d{2}$/.test(startMonth)) startMonth = state.billsMonth;
      if(!bname || !bvalue) return;
      update(function(){
        if(id){
          var b = state.fixedBills.filter(function(x){return x.id===id;})[0];
          b.name=bname; b.natureza=natureza; b.value=bvalue; b.dueDay=bDueDay; b.tipoRecorrencia=tipoRecorrencia; b.totalParcelas=totalParcelas; b.forma=forma; b.cardId=cardId; b.accountId=accountId; b.startMonth=startMonth;
        }else{
          state.fixedBills.push({ id:uid(), name:bname, natureza:natureza, value:bvalue, dueDay:bDueDay, tipoRecorrencia:tipoRecorrencia, totalParcelas:totalParcelas, forma:forma, cardId:cardId, accountId:accountId, startMonth:startMonth, manuallyPaidMonths:[] });
        }
        state.editing={type:null,id:null,transferId:null}; state.billDraft=freshBillDraft();
      });
    }

    if(type === 'pay-invoice'){
      var cardId2 = form.dataset.cardId, ck = form.dataset.cycle;
      var card = state.cards.filter(function(c){return c.id===cardId2;})[0];
      var accountId2 = fd.get('accountId');
      var amount = parseFloat(fd.get('amount'));
      if(!card || !accountId2 || !amount) return;
      update(function(){
        state.transactions.push({ id:uid(), value:amount, date:todayISO(), desc:card.name+' - Pagamento de fatura ('+monthLabel(ck)+')', category:'Fatura de cartão', forma:PAGAMENTO_FATURA_FORMA, tipo:'saida', accountId:accountId2, cardId:null, invoiceCycleKey:null, installment:null, paidCardId:card.id, paidCycleKey:ck });
        card.paymentsByCycle = card.paymentsByCycle || {};
        card.paymentsByCycle[ck] = (card.paymentsByCycle[ck]||0) + amount;
        state.payingCycle = null;
      });
    }

    if(type === 'launch-bill'){
      var billId = form.dataset.billId;
      var bill = state.fixedBills.filter(function(b){return b.id===billId;})[0];
      var ldate = fd.get('date') || todayISO();
      var lvalue = parseFloat(fd.get('value'));
      var laccountId = fd.get('accountId');
      if(!bill || !lvalue) return;
      var billMonth = form.dataset.month || ldate.slice(0,7);
      update(function(){
        var tipo = bill.natureza==='receita' ? 'entrada' : 'saida';
        var tx = { id:uid(), value:lvalue, date:ldate, desc:bill.name, category: bill.natureza==='receita'?'Receita fixa':'Contas fixas', forma: bill.forma==='cartao'?'Cartão de Crédito':(bill.forma==='boleto'?'Boleto':'Débito automático'), tipo:tipo, accountId:null, cardId:null, invoiceCycleKey:null, installment:null, billId:bill.id, billMonth:billMonth };
        if(bill.forma === 'cartao' && bill.cardId){
          var cardObj = state.cards.filter(function(c){return c.id===bill.cardId;})[0];
          if(cardObj){ tx.cardId = bill.cardId; tx.invoiceCycleKey = cycleKey(invoiceCycleForDate(cardObj, toLocalDate(ldate))); }
        }else{
          tx.accountId = laccountId || bill.accountId;
        }
        state.transactions.push(tx);
        state.launchingBillId = null;
      });
    }

    if(type === 'add-category'){
      var catName = (fd.get('name')||'').trim();
      if(!catName) return;
      update(function(){ if(state.categories.indexOf(catName)===-1) state.categories.push(catName); });
      form.reset();
    }

    if(type === 'add-income-category'){
      var incCatName = (fd.get('name')||'').trim();
      if(!incCatName) return;
      update(function(){ if(state.incomeCategories.indexOf(incCatName)===-1) state.incomeCategories.push(incCatName); });
      form.reset();
    }

    if(type === 'add-presente-category'){
      var presCatName = (fd.get('name')||'').trim();
      if(!presCatName) return;
      update(function(){ if(state.presenteCategories.indexOf(presCatName)===-1) state.presenteCategories.push(presCatName); });
      form.reset();
    }

    if(type === 'set-budget'){
      var bcat = fd.get('category');
      var bval = parseFloat(fd.get('value')) || 0;
      if(!bcat) return;
      update(function(){ if(bval > 0) state.budgets[bcat] = bval; else delete state.budgets[bcat]; });
      form.reset();
    }

    if(type === 'transaction'){
      var value = parseFloat(fd.get('value'));
      var date = fd.get('date') || todayISO();
      var desc = (fd.get('desc')||'').trim();
      var category = (fd.get('category')||'').trim();
      var tipo = fd.get('tipo');
      var isTransfer = tipo === 'transferencia';
      var forma = isTransfer ? null : fd.get('forma');
      var isCard = !isTransfer && forma === 'Cartão de Crédito';
      var isReceita = tipo === 'entrada';
      var isPresente = tipo === 'presente';

      if(isTransfer){
        var origemId = fd.get('origemId'), destinoId = fd.get('destinoId');
        if(!desc) desc = 'Transferência entre contas';
        if(!value || !origemId || !destinoId || origemId===destinoId) return;
        var transferCategory = 'Transferência interna';
        update(function(){
          if(id && state.editing.transferId){
            var pair = state.transactions.filter(function(x){return x.transferId===state.editing.transferId;});
            var saidaLeg = pair.filter(function(x){return x.tipo==='saida';})[0];
            var entradaLeg = pair.filter(function(x){return x.tipo==='entrada';})[0];
            if(saidaLeg){ Object.assign(saidaLeg, { value:value, date:date, desc:desc, accountId:origemId }); }
            if(entradaLeg){ Object.assign(entradaLeg, { value:value, date:date, desc:desc, accountId:destinoId }); }
          }else{
            var transferId = uid();
            state.transactions.push({ id:uid(), value:value, date:date, desc:desc, category:transferCategory, forma:'Transferência', tipo:'saida', accountId:origemId, cardId:null, invoiceCycleKey:null, installment:null, isTransfer:true, transferId:transferId });
            state.transactions.push({ id:uid(), value:value, date:date, desc:desc, category:transferCategory, forma:'Transferência', tipo:'entrada', accountId:destinoId, cardId:null, invoiceCycleKey:null, installment:null, isTransfer:true, transferId:transferId });
          }
          state.editing={type:null,id:null,transferId:null}; state.txDraft=freshTxDraft();
        });
        return;
      }

      var accountId = isCard ? null : fd.get('accountId');
      var cardId = isCard ? fd.get('cardId') : null;
      var cycleOverride = isCard ? fd.get('invoiceCycleOverride') : null;
      var applyToFollowing = fd.get('applyToFollowing') === 'on';
      if(!value || !desc || !category) return;
      if(isCard && !cardId) return;
      if(!isCard && !accountId) return;

      update(function(){
        if(id){
          var existing = state.transactions.filter(function(t){return t.id===id;})[0];
          var patch = { value:value, date:date, desc:desc, category:category, forma:forma, tipo:tipo, accountId:accountId, cardId:cardId };
          if(isCard){
            var cardObjE = state.cards.filter(function(c){return c.id===cardId;})[0];
            patch.invoiceCycleKey = cycleOverride || (cardObjE ? cycleKey(invoiceCycleForDate(cardObjE, toLocalDate(date))) : null);
          }else{ patch.invoiceCycleKey = null; patch.installment = null; patch.installmentGroupId = null; }
          Object.assign(existing, patch);
          if(applyToFollowing && existing.installmentGroupId){
            var gid = existing.installmentGroupId, fromN = existing.installment.current;
            state.transactions.forEach(function(x){
              if(x.installmentGroupId===gid && x.installment && x.installment.current > fromN){
                x.value = value; x.desc = desc; x.category = category; x.forma = forma; x.tipo = tipo; x.cardId = cardId;
              }
            });
          }
        }else{
          if(isCard){
            var cardObj = state.cards.filter(function(c){return c.id===cardId;})[0];
            var n = clampInt(fd.get('installments')||1, 1, 24);
            var baseCycle = cycleOverride ? parseCycleKey(cycleOverride) : invoiceCycleForDate(cardObj, toLocalDate(date));
            var cents = Math.round(value*100);
            var base = Math.floor(cents/n), rem = cents - base*n;
            var groupId = n > 1 ? uid() : null;
            for(var i=0;i<n;i++){
              var amtCents = base + (i<rem?1:0);
              var cyc = addMonthsToCycle(baseCycle, i);
              var txDate = i===0 ? date : (function(){ var dd = cycleOpenDate(cardObj, cyc); return dd.getFullYear()+'-'+pad2(dd.getMonth()+1)+'-'+pad2(dd.getDate()); })();
              state.transactions.push({ id:uid(), value:amtCents/100, date:txDate, desc:desc, category:category, forma:forma, tipo:tipo, accountId:null, cardId:cardId, invoiceCycleKey:cycleKey(cyc), installment: n>1?{current:i+1,total:n}:null, installmentGroupId: groupId });
            }
          }else{
            state.transactions.push({ id:uid(), value:value, date:date, desc:desc, category:category, forma:forma, tipo:tipo, accountId:accountId, cardId:null, invoiceCycleKey:null, installment:null });
          }
        }
        state.editing={type:null,id:null,transferId:null}; state.txDraft=freshTxDraft();
      });
    }
  });

  window.addEventListener('error', function(e){
    var el = document.getElementById('fatal-error');
    if(!el){ el=document.createElement('div'); el.id='fatal-error'; el.style.cssText='position:fixed;top:0;left:0;right:0;background:#5c1c1c;color:#fff;padding:10px 16px;font:12px monospace;z-index:9999;'; document.body.insertBefore(el, document.body.firstChild); }
    el.textContent = 'Erro no app: ' + e.message + ' (linha ' + e.lineno + ')';
  });

  loadState();
})();
</script>
</body>
</html>
